(function () {
  var KEY = "sc100-sim-v1";
  var PASS = 70;
  var SECS_PER_Q = 90;
  var store = { history: [], missed: [], custom: [] };
  var S = { view: "home", cfg: { off: {}, n: 20 }, run: null, msg: "" };
  var app = document.getElementById("app");

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var o = JSON.parse(raw);
        store.history = o.history || [];
        store.missed = o.missed || [];
        store.custom = o.custom || [];
      }
    } catch (e) {}
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {}
  }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function bank() { return BANK.concat(store.custom); }
  function allDomains() {
    var d = DOMAINS.slice();
    bank().forEach(function (q) { if (d.indexOf(q.domain) < 0) d.push(q.domain); });
    return d;
  }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function fmt(s) {
    var m = Math.floor(s / 60), r = s % 60;
    return m + ":" + (r < 10 ? "0" : "") + r;
  }
  function letter(i) { return String.fromCharCode(65 + i); }

  /* ---------- validation / scoring ---------- */
  function isInt(n, max) { return typeof n === "number" && n % 1 === 0 && n >= 0 && n < max; }
  function validQ(q) {
    if (!q || typeof q !== "object") return "entrée vide";
    if (typeof q.q !== "string" || !q.q) return "champ q manquant";
    if (["single", "multi", "fields", "order"].indexOf(q.type) < 0) return "type inconnu";
    if (q.type === "fields") {
      if (!Array.isArray(q.fields) || !q.fields.length) return "fields manquant";
      for (var i = 0; i < q.fields.length; i++) {
        var f = q.fields[i];
        if (!f || !f.label || !Array.isArray(f.options) || f.options.length < 2 || !isInt(f.answer, f.options.length)) return "champ " + (i + 1) + " invalide";
      }
      return "";
    }
    if (!Array.isArray(q.options) || q.options.length < 2) return "options manquantes";
    if (q.type === "single") return isInt(q.answer, q.options.length) ? "" : "answer invalide";
    if (!Array.isArray(q.answer) || !q.answer.length) return "answer invalide";
    for (var k = 0; k < q.answer.length; k++) if (!isInt(q.answer[k], q.options.length)) return "answer invalide";
    return "";
  }
  function isComplete(q, a) {
    if (a === undefined || a === null) return false;
    if (q.type === "single") return typeof a === "number";
    if (q.type === "multi") return a.length > 0;
    if (q.type === "order") return a.length === q.answer.length;
    return a.length === q.fields.length && a.every(function (v) { return v >= 0; });
  }
  function isCorrect(q, a) {
    if (!isComplete(q, a)) return false;
    if (q.type === "single") return a === q.answer;
    if (q.type === "multi") {
      var x = a.slice().sort(), y = q.answer.slice().sort();
      return x.length === y.length && x.every(function (v, i) { return v === y[i]; });
    }
    if (q.type === "order") return a.every(function (v, i) { return v === q.answer[i]; });
    return a.every(function (v, i) { return v === q.fields[i].answer; });
  }
  function expected(q) {
    if (q.type === "single") return esc(letter(q.answer) + ". " + q.options[q.answer]);
    if (q.type === "multi") return q.answer.slice().sort().map(function (i) { return esc(letter(i) + ". " + q.options[i]); }).join("<br>");
    if (q.type === "order") return q.answer.map(function (i, n) { return esc((n + 1) + ". " + q.options[i]); }).join("<br>");
    return q.fields.map(function (f) { return esc(f.label) + " : <b>" + esc(f.options[f.answer]) + "</b>"; }).join("<br>");
  }
  function given(q, a) {
    if (!a && a !== 0) return "Aucune réponse";
    if (q.type === "single") return esc(letter(a) + ". " + q.options[a]);
    if (q.type === "multi") return a.length ? a.slice().sort().map(function (i) { return esc(letter(i) + ". " + q.options[i]); }).join("<br>") : "Aucune réponse";
    if (q.type === "order") return a.length ? a.map(function (i, n) { return esc((n + 1) + ". " + q.options[i]); }).join("<br>") : "Aucune réponse";
    return q.fields.map(function (f, k) { return esc(f.label) + " : <b>" + (a[k] >= 0 && a[k] != null ? esc(f.options[a[k]]) : "—") + "</b>"; }).join("<br>");
  }

  /* ---------- home ---------- */
  function pool() {
    return bank().filter(function (q) { return !S.cfg.off[q.domain]; });
  }
  function renderHome() {
    var b = bank(), doms = allDomains();
    var counts = {};
    doms.forEach(function (d) { counts[d] = 0; });
    b.forEach(function (q) { counts[q.domain] += 1; });
    var h = '<section class="hero"><h1>Simulateur SC-100</h1><p class="lead">Microsoft Cybersecurity Architect Expert. Les questions reprennent vos exercices, avec une explication pour chaque réponse.</p></section>';
    h += '<div class="stats" aria-label="Résumé">' +
      '<div><span class="num mono">' + b.length + '</span><span class="lbl">questions</span></div>' +
      '<div><span class="num mono">' + store.history.length + '</span><span class="lbl">sessions faites</span></div>' +
      '<div><span class="num mono" id="missedN">' + store.missed.filter(inBank).length + '</span><span class="lbl">à retravailler</span></div></div>';
    h += '<section class="card"><h2>Préparer une session</h2>';
    h += '<p class="sub">Domaines</p><div class="chips" id="chips">';
    doms.forEach(function (d) {
      var on = !S.cfg.off[d];
      h += '<button class="chip" data-act="dom" data-d="' + esc(d) + '" aria-pressed="' + on + '">' + esc(d) + ' <span class="mono">' + counts[d] + '</span></button>';
    });
    h += '</div><p class="sub">Nombre de questions</p><div class="chips" id="ns">';
    [10, 20, "all"].forEach(function (n) {
      h += '<button class="chip" data-act="n" data-n="' + n + '" aria-pressed="' + (S.cfg.n === n) + '">' + (n === "all" ? "Toutes" : n) + '</button>';
    });
    h += '</div><p class="selinfo" id="selinfo"></p>';
    h += '<div class="actions"><button class="btn primary" data-act="practice">Entraînement</button><button class="btn" data-act="exam">Examen blanc</button><button class="btn" data-act="errors" id="errBtn">Revoir mes erreurs</button></div>';
    h += '<p class="small">Entraînement : correction après chaque question. Examen blanc : ' + SECS_PER_Q + ' secondes par question, correction à la fin. Seuil de réussite indicatif : ' + PASS + ' %.</p>';
    if (S.msg) h += '<p class="msg" role="status">' + esc(S.msg) + '</p>';
    h += '</section>';
    if (store.history.length) {
      h += '<section class="card"><h2>Dernières sessions</h2><ul class="hist">';
      store.history.slice(-5).reverse().forEach(function (x) {
        var p = Math.round(100 * x.ok / x.total), d = "";
        try { d = new Date(x.t).toLocaleString("fr-CA", { dateStyle: "medium", timeStyle: "short" }); } catch (e) {}
        h += '<li><span>' + esc(d) + ' · ' + (x.mode === "exam" ? "Examen" : "Entraînement") + '</span><span class="mono ' + (p >= PASS ? "okc" : "badc") + '">' + x.ok + "/" + x.total + " · " + p + " %</span></li>";
      });
      h += "</ul></section>";
    }
    h += '<section class="card"><details id="imp"><summary>Ajouter mes propres questions</summary>' +
      '<p class="small">Collez un tableau JSON. Les ajouts restent dans ce navigateur. Types acceptés : single, multi, fields, order.</p>' +
      '<pre class="code mono">[{"domain":"Réseau &amp; Zero Trust","type":"single",\n "q":"Question en anglais…",\n "options":["A","B","C","D"],"answer":1,\n "why":"Explication en français."}]</pre>' +
      '<label class="sub" for="impTxt">JSON</label><textarea id="impTxt" rows="6" spellcheck="false"></textarea>' +
      '<div class="actions"><button class="btn" data-act="import">Ajouter à la banque</button><button class="btn" data-act="clear" ' + (store.custom.length ? "" : "disabled") + '>Supprimer mes ajouts (' + store.custom.length + ')</button></div>' +
      '<p class="msg" id="impMsg" role="status"></p></details></section>';
    app.innerHTML = h;
    updateSel();
  }
  function inBank(id) { return bank().some(function (q) { return q.id === id; }); }
  function updateSel() {
    var n = pool().length;
    var el = document.getElementById("selinfo");
    if (el) el.textContent = n + (n > 1 ? " questions disponibles" : " question disponible") + " pour cette sélection.";
    var eb = document.getElementById("errBtn");
    if (eb) eb.disabled = !store.missed.filter(inBank).length;
    var pb = app.querySelectorAll('[data-act="practice"],[data-act="exam"]');
    for (var i = 0; i < pb.length; i++) pb[i].disabled = n === 0;
  }

  /* ---------- run ---------- */
  function start(mode) {
    var list;
    if (mode === "errors") {
      list = bank().filter(function (q) { return store.missed.indexOf(q.id) >= 0; });
      mode = "practice";
    } else {
      list = shuffle(pool());
      if (S.cfg.n !== "all") list = list.slice(0, S.cfg.n);
    }
    if (!list.length) { S.msg = "Aucune question dans cette sélection."; renderHome(); return; }
    S.msg = "";
    S.run = { mode: mode, list: shuffle(list), i: 0, ans: {}, locked: {}, deadline: 0, tick: null };
    if (mode === "exam") {
      S.run.deadline = Date.now() + list.length * SECS_PER_Q * 1000;
      S.run.tick = setInterval(tick, 1000);
    }
    S.view = "quiz";
    render();
  }
  function tick() {
    var r = S.run;
    if (!r) return;
    var left = Math.max(0, Math.round((r.deadline - Date.now()) / 1000));
    var el = document.getElementById("timer");
    if (el) { el.textContent = fmt(left); el.classList.toggle("low", left <= 60); }
    if (left <= 0) finish();
  }
  function stopTimer() {
    if (S.run && S.run.tick) { clearInterval(S.run.tick); S.run.tick = null; }
  }

  function renderQuiz() {
    var r = S.run, q = r.list[r.i], a = r.ans[q.id], locked = !!r.locked[q.id];
    var exam = r.mode === "exam";
    var h = '<div class="qhead"><span class="mono">Question ' + (r.i + 1) + " / " + r.list.length + '</span><span class="tag">' + esc(q.domain) + "</span>";
    h += exam ? '<span class="timer mono" id="timer" aria-label="Temps restant"></span>' : "<span></span>";
    h += '</div><div class="bar"><i style="width:' + Math.round(100 * (r.i + (locked ? 1 : 0)) / r.list.length) + '%"></i></div>';
    h += '<section class="card"><p class="prompt">' + esc(q.q) + "</p>";
    if (q.note) h += '<p class="notei">' + esc(q.note) + "</p>";
    if (q.type === "multi") h += '<p class="hint">Choisissez ' + q.answer.length + (q.answer.length > 1 ? " réponses." : " réponse.") + "</p>";
    if (q.type === "order") h += '<p class="hint">Touchez les actions dans l\'ordre, ' + q.answer.length + " au total. Touchez une action de la séquence pour la retirer.</p>";
    h += inputs(q, a, locked) + "</section>";
    if (locked && !exam) h += feedback(q, a);
    h += '<div class="actions sticky">';
    if (exam) {
      h += '<button class="btn" data-act="prev"' + (r.i === 0 ? " disabled" : "") + ">Précédente</button>";
      h += r.i < r.list.length - 1 ? '<button class="btn primary" data-act="next">Suivante</button>' : '<button class="btn primary" data-act="finish">Terminer l\'examen</button>';
      h += '<button class="btn quiet" data-act="finish">Terminer maintenant</button>';
    } else {
      if (!locked) h += '<button class="btn primary" data-act="validate"' + (isComplete(q, a) ? "" : " disabled") + ' id="valBtn">Valider</button>';
      else h += r.i < r.list.length - 1 ? '<button class="btn primary" data-act="next">Question suivante</button>' : '<button class="btn primary" data-act="finish">Voir le résultat</button>';
      h += '<button class="btn quiet" data-act="finish">Arrêter</button>';
    }
    h += "</div>";
    app.innerHTML = h;
    if (exam) tick();
  }
  function inputs(q, a, locked) {
    var h = "";
    if (q.type === "single" || q.type === "multi") {
      h += '<div class="opts" role="' + (q.type === "single" ? "radiogroup" : "group") + '">';
      q.options.forEach(function (o, i) {
        var sel = q.type === "single" ? a === i : !!(a && a.indexOf(i) >= 0);
        var right = q.type === "single" ? q.answer === i : q.answer.indexOf(i) >= 0;
        var cls = "opt" + (sel ? " sel" : "");
        var mark = "";
        if (locked) {
          if (right) { cls += " ok"; mark = '<span class="mk">Bonne réponse</span>'; }
          else if (sel) { cls += " bad"; mark = '<span class="mk">Votre choix</span>'; }
        }
        h += '<button class="' + cls + '" data-act="opt" data-i="' + i + '" aria-pressed="' + sel + '"' + (locked ? " disabled" : "") + '><span class="ltr mono">' + letter(i) + '</span><span class="otx">' + esc(o) + "</span>" + mark + "</button>";
      });
      h += "</div>";
    } else if (q.type === "fields") {
      h += '<div class="flds">';
      q.fields.forEach(function (f, k) {
        var v = a ? a[k] : -1;
        var cls = "fld";
        if (locked) cls += v === f.answer ? " ok" : " bad";
        h += '<div class="' + cls + '"><label for="f' + k + '">' + esc(f.label) + '</label><select id="f' + k + '" data-f="' + k + '"' + (locked ? " disabled" : "") + '><option value="-1"' + (v < 0 || v == null ? " selected" : "") + ">Choisir…</option>";
        f.options.forEach(function (o, i) { h += '<option value="' + i + '"' + (v === i ? " selected" : "") + ">" + esc(o) + "</option>"; });
        h += "</select>";
        if (locked && v !== f.answer) h += '<span class="mk">Attendu : ' + esc(f.options[f.answer]) + "</span>";
        h += "</div>";
      });
      h += "</div>";
    } else {
      var seq = a || [];
      h += '<p class="sub">Actions disponibles</p><div class="opts">';
      q.options.forEach(function (o, i) {
        var used = seq.indexOf(i) >= 0;
        h += '<button class="opt' + (used ? " used" : "") + '" data-act="add" data-i="' + i + '"' + (used || locked ? " disabled" : "") + '><span class="ltr mono">+</span><span class="otx">' + esc(o) + "</span></button>";
      });
      h += '</div><p class="sub">Votre séquence</p><ol class="seq">';
      if (!seq.length) h += '<li class="empty">Aucune action choisie.</li>';
      seq.forEach(function (i, n) {
        var cls = "";
        if (locked) cls = i === q.answer[n] ? "ok" : "bad";
        h += '<li class="' + cls + '"><button class="opt seqb ' + cls + '" data-act="rem" data-k="' + n + '"' + (locked ? " disabled" : "") + '><span class="ltr mono">' + (n + 1) + '</span><span class="otx">' + esc(q.options[i]) + "</span></button></li>";
      });
      h += "</ol>";
    }
    return h;
  }
  function feedback(q, a) {
    var ok = isCorrect(q, a);
    var h = '<section class="fb ' + (ok ? "okb" : "badb") + '" role="status"><p class="verdict">' + (ok ? "Correct" : "Incorrect") + "</p>";
    if (!ok) h += '<p class="exp"><b>Réponse attendue</b><br>' + expected(q) + "</p>";
    h += '<p class="why">' + esc(q.why || "") + "</p>";
    if (q.rev) h += '<p class="rev"><b>À vérifier</b><br>' + esc(q.rev) + "</p>";
    return h + "</section>";
  }

  function setAnswer(q, a) {
    S.run.ans[q.id] = a;
  }
  function finish() {
    var r = S.run;
    if (!r) return;
    stopTimer();
    var ok = 0, byDom = {}, missed = [], fixed = [];
    r.list.forEach(function (q) {
      var c = isCorrect(q, r.ans[q.id]);
      if (!byDom[q.domain]) byDom[q.domain] = { ok: 0, n: 0 };
      byDom[q.domain].n += 1;
      if (c) { ok += 1; byDom[q.domain].ok += 1; fixed.push(q.id); }
      else if (r.mode === "exam" || r.locked[q.id]) missed.push(q.id);
    });
    store.missed = store.missed.filter(function (id) { return fixed.indexOf(id) < 0 && missed.indexOf(id) < 0; }).concat(missed);
    store.history.push({ t: Date.now(), mode: r.mode, ok: ok, total: r.list.length });
    store.history = store.history.slice(-20);
    save();
    r.result = { ok: ok, byDom: byDom };
    S.view = "results";
    render();
  }

  function renderResults() {
    var r = S.run, res = r.result, total = r.list.length;
    var p = Math.round(100 * res.ok / total), pass = p >= PASS;
    var h = '<section class="hero"><p class="sub">' + (r.mode === "exam" ? "Examen blanc" : "Entraînement") + "</p><h1>" + res.ok + " / " + total + ' <span class="pct mono ' + (pass ? "okc" : "badc") + '">' + p + " %</span></h1><p class=\"lead\">" +
      (pass ? "Au-dessus du seuil indicatif de " + PASS + " %." : "Sous le seuil indicatif de " + PASS + " %. Les questions manquées sont gardées dans « Revoir mes erreurs ».") + "</p></section>";
    h += '<section class="card"><h2>Par domaine</h2><ul class="doms">';
    Object.keys(res.byDom).forEach(function (d) {
      var x = res.byDom[d], pc = Math.round(100 * x.ok / x.n);
      h += "<li><span>" + esc(d) + '</span><span class="mono">' + x.ok + "/" + x.n + '</span><div class="bar sm"><i class="' + (pc >= PASS ? "g" : "r") + '" style="width:' + pc + '%"></i></div></li>';
    });
    h += "</ul></section>";
    h += '<section class="card"><h2>Correction détaillée</h2>';
    r.list.forEach(function (q, n) {
      var a = r.ans[q.id], c = isCorrect(q, a);
      h += '<details class="rv"><summary><span class="st ' + (c ? "okc" : "badc") + '">' + (c ? "Juste" : "Faux") + "</span><span>" + (n + 1) + ". " + esc(q.q) + "</span></summary>";
      if (!c) h += '<p class="exp"><b>Votre réponse</b><br>' + given(q, a) + "</p>";
      h += '<p class="exp"><b>Réponse attendue</b><br>' + expected(q) + '</p><p class="why">' + esc(q.why || "") + "</p>";
      if (q.rev) h += '<p class="rev"><b>À vérifier</b><br>' + esc(q.rev) + "</p>";
      h += "</details>";
    });
    h += "</section>";
    h += '<div class="actions"><button class="btn primary" data-act="home">Nouvelle session</button><button class="btn" data-act="errors"' + (store.missed.filter(inBank).length ? "" : " disabled") + ">Revoir mes erreurs</button></div>";
    app.innerHTML = h;
  }

  function render() {
    window.scrollTo(0, 0);
    if (S.view === "home") renderHome();
    else if (S.view === "quiz") renderQuiz();
    else renderResults();
  }

  /* ---------- events ---------- */
  app.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]");
    if (!t || t.disabled) return;
    var act = t.getAttribute("data-act"), r = S.run, q = r && r.list[r.i];
    if (act === "dom") {
      var d = t.getAttribute("data-d");
      S.cfg.off[d] = !S.cfg.off[d];
      t.setAttribute("aria-pressed", String(!S.cfg.off[d]));
      updateSel();
    } else if (act === "n") {
      var v = t.getAttribute("data-n");
      S.cfg.n = v === "all" ? "all" : parseInt(v, 10);
      var all = app.querySelectorAll('[data-act="n"]');
      for (var i = 0; i < all.length; i++) all[i].setAttribute("aria-pressed", String(all[i] === t));
    } else if (act === "practice") start("practice");
    else if (act === "exam") start("exam");
    else if (act === "errors") start("errors");
    else if (act === "opt") {
      if (r.locked[q.id]) return;
      var idx = parseInt(t.getAttribute("data-i"), 10);
      if (q.type === "single") setAnswer(q, idx);
      else {
        var cur = (r.ans[q.id] || []).slice(), at = cur.indexOf(idx);
        if (at >= 0) cur.splice(at, 1); else cur.push(idx);
        setAnswer(q, cur);
      }
      renderQuiz();
    } else if (act === "add") {
      var s1 = (r.ans[q.id] || []).slice();
      if (s1.length < q.answer.length) s1.push(parseInt(t.getAttribute("data-i"), 10));
      setAnswer(q, s1); renderQuiz();
    } else if (act === "rem") {
      var s2 = (r.ans[q.id] || []).slice();
      s2.splice(parseInt(t.getAttribute("data-k"), 10), 1);
      setAnswer(q, s2); renderQuiz();
    } else if (act === "validate") {
      if (!isComplete(q, r.ans[q.id])) return;
      r.locked[q.id] = true; renderQuiz();
    } else if (act === "next") { r.i = Math.min(r.list.length - 1, r.i + 1); render(); }
    else if (act === "prev") { r.i = Math.max(0, r.i - 1); render(); }
    else if (act === "finish") finish();
    else if (act === "home") { S.view = "home"; S.run = null; render(); }
    else if (act === "import") doImport();
    else if (act === "clear") { store.custom = []; save(); S.msg = ""; var keep = document.getElementById("imp").open; renderHome(); document.getElementById("imp").open = keep; }
  });
  app.addEventListener("change", function (e) {
    var el = e.target;
    if (!el.matches || !el.matches("select[data-f]")) return;
    var r = S.run, q = r.list[r.i];
    var cur = (r.ans[q.id] || q.fields.map(function () { return -1; })).slice();
    cur[parseInt(el.getAttribute("data-f"), 10)] = parseInt(el.value, 10);
    setAnswer(q, cur);
    var vb = document.getElementById("valBtn");
    if (vb) vb.disabled = !isComplete(q, cur);
  });

  function doImport() {
    var ta = document.getElementById("impTxt"), msg = document.getElementById("impMsg");
    var data;
    try { data = JSON.parse(ta.value); } catch (err) { msg.textContent = "JSON invalide : " + err.message; return; }
    if (!Array.isArray(data)) data = [data];
    var good = [], bad = [];
    data.forEach(function (q, k) {
      var e = validQ(q);
      if (e) { bad.push("#" + (k + 1) + " " + e); return; }
      q.id = q.id && typeof q.id === "string" ? q.id : "c" + Date.now() + "-" + k;
      q.domain = q.domain || "Personnalisé";
      good.push(q);
    });
    if (bad.length) { msg.textContent = "Rien n'a été ajouté. " + bad.join(" ; "); return; }
    store.custom = store.custom.concat(good);
    save();
    renderHome();
    document.getElementById("imp").open = true;
    document.getElementById("impMsg").textContent = good.length + " question(s) ajoutée(s).";
  }

  load();
  render();
})();

</script>

</body></html>
