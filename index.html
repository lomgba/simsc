   ["Enable intelligent risk-based assessments of applications", ["Defender for Identity", "Defender for Office 365", "Defender for Cloud Apps", "Defender Vulnerability Management"], 2],
   ["Enable asset visibility and intelligent assessment of multiple OS", ["Defender for Identity", "Defender for Office 365", "Defender for Cloud Apps", "Defender Vulnerability Management"], 3]],
  "Defender for Identity surveille les identités AD, Defender for Office 365 protège la messagerie (phishing, liens, pièces jointes), Defender for Cloud Apps évalue le risque des applications cloud (CASB) et Defender Vulnerability Management offre la visibilité et l'évaluation des vulnérabilités multi-OS.");

S(D_GOV, "You are a security architect for a company in a hybrid, multicloud environment. You need a solution that ensures unified security management, visibility and seamless integration of security policies across on-premises and cloud resources. Which solution should you recommend?",
  ["Azure Monitor", "Azure Arc", "Microsoft Sentinel", "Microsoft Defender for Identity"], 1,
  "Azure Arc projette les ressources hors Azure (on-premises, autres clouds) dans Azure Resource Manager, ce qui permet d'y appliquer Azure Policy, Defender for Cloud et la gouvernance de façon uniforme.");

M(D_GOV, "Your organization applies the Zero Trust Rapid Modernization Plan (RaMP). The estate contains Identity (Azure AD), Endpoints (Intune), DevOps (Azure DevOps), IoT devices (Azure IoT) and Applications (Intune). Which three service types should you modernize as a priority?",
  ["Endpoints", "DevOps", "Applications", "Identity", "IoT devices"], [0, 2, 3],
  "Selon le corrigé du dump, les initiatives prioritaires de RaMP portent sur l'identité, les terminaux et les applications. DevOps et IoT viennent après.");

M(D_ID, "Enabling security defaults produces a 26-point security posture increase. Which three actions are enabled when security defaults are turned on?",
  ["Requiring administrators to use multifactor authentication", "Designating more than one Global Admin", "Using privileged admin roles", "Blocking legacy authentication protocols", "Requiring users to use multifactor authentication when necessary", "Enabling self-service password reset"], [0, 3, 4],
  "Les paramètres de sécurité par défaut imposent l'inscription MFA, exigent la MFA des administrateurs, la MFA des utilisateurs si nécessaire, bloquent l'authentification héritée et protègent les actions privilégiées. Ils ne configurent ni SSPR ni la désignation de plusieurs Global Admin.");

S(D_DATA, "All VDI VMs (Windows 11 Enterprise) are joined to Microsoft Entra ID. You need a tool that facilitates BitLocker deployment, does not require an agent to be installed and allows encryption to be managed at the OS level.",
  ["Microsoft Endpoint Configuration Manager", "Azure Storage Server-Side Encryption", "Microsoft Defender for Storage", "Microsoft Intune"], 3,
  "Intune gère BitLocker via des stratégies de sécurité des points de terminaison, sans agent supplémentaire pour des appareils joints à Entra ID. Configuration Manager exige son client, et le chiffrement côté serveur du stockage n'agit pas au niveau du système d'exploitation.");

S(D_OPS, "You want to integrate Azure Automation Update Management with Microsoft Configuration Manager so security updates can be reported and pre-staged. Currently the updates are not received from Configuration Manager. What is a prerequisite before this can happen?",
  ["Configuring the Windows Agent to communicate with Windows Server Update Service (WSUS)", "Giving the Windows Agent access to Microsoft Updates", "Hybrid-joining on-premises servers and end user devices", "Configuring Microsoft Configuration Manager to manage security updates"], 1,
  "Le corrigé du dump retient l'accès de l'agent Windows à Microsoft Update.",
  { rev: "À vérifier : la logique de la question est ambiguë (agent → WSUS vs Microsoft Update). Retiens la réponse du dump, mais ne la considère pas comme certaine." });

S(D_OPS, "An organization wants to manage security updates for a hybrid environment of on-premises and cloud-based Windows devices: timely updates, minimal administrative workload, tailored update policies by location and usage. Which approach is best?",
  ["Implement Configuration Manager exclusively for all devices, including those sporadically connected.", "Use a hybrid approach with Configuration Manager for on-premises and Intune for cloud-based devices.", "Use WSUS exclusively for both environments.", "Rely on Microsoft Intune for all devices across network locations."], 1,
  "Configuration Manager reste adapté aux postes on-premises connectés, Intune aux appareils cloud ou intermittents : chaque groupe reçoit une stratégie adaptée à son contexte, avec moins de charge qu'un outil unique mal adapté.");

S(D_GOV, "You enabled Microsoft Defender for Cloud on a new customer subscription and checked compliance with Azure CIS. Which task should you perform to evaluate the subscription's posture against ISO 27001?",
  ["Publish the ISO 27001 blueprint in Azure Blueprints", "Add a standard in Microsoft Defender for Cloud.", "Enable enhanced security features for the subscription.", "Assign the Azure Security Benchmark to the subscription."], 1,
  "Dans Defender for Cloud, on ajoute le standard ISO 27001 au tableau de bord de conformité réglementaire pour l'évaluer en continu. Blueprints applique des configurations, il n'évalue pas la posture.");

M(D_ID, "You plan to use the Microsoft cloud security benchmark to protect identity and authentication systems. Which three common security controls should you implement?",
  ["Enforce strong passwordless authentication.", "Use managed application identities.", "Restrict privileged roles and accounts.", "Monitor and audit high risk activities.", "Monitor and audit strong authentication for all privileged access."], [2, 3, 4],
  "Le corrigé du dump retient : restreindre les rôles et comptes privilégiés, superviser/auditer les activités à risque et superviser l'authentification forte des accès privilégiés.",
  { rev: "À vérifier : les intitulés correspondent mal à la numérotation officielle du benchmark ; on s'appuie ici sur les cases cochées dans le dump." });

S(D_DATA, "Your company has a Microsoft 365 E5 subscription and must manage the keys Microsoft 365 uses to encrypt data at rest. What should you recommend first after completing prerequisites?",
  ["Modify the Purview Service Encryption configuration.", "Use the Customer Key Onboarding Service.", "Import the company's keys into an Azure key vault.", "Generate keys and configure Double Key Encryption (DKE)."], 1,
  "Customer Key s'active via le service d'intégration (onboarding) qui exécute les cmdlets PowerShell nécessaires. Les clés dans Key Vault et la configuration Purview viennent après cette étape.",
  { note: "L'ordre des options est reconstitué (un intitulé est illisible dans la capture)." });

S(D_DEV, "Patient health records are stored in Azure Storage and processed by custom mobile apps hosted on Azure App Service. Your cyber insurer requires proof of vulnerability mitigation. You need to identify the attack vectors a malicious actor may use to exploit your apps. Which process or tool should you use?",
  ["Malware analysis", "Forensic analysis", "Regression testing", "Threat modeling"], 3,
  "La modélisation des menaces (threat modeling) identifie les vecteurs d'attaque possibles sur une application avant qu'ils soient exploités. Les analyses de malware ou forensiques sont réactives et la non-régression teste la stabilité fonctionnelle.");

S(D_GOV, "Your company plans to gradually migrate subsidiaries to Azure using landing zone architectures aligned with benchmarks such as ISO 27001, applicable at scale across multiple subscriptions. Which Azure capability should you use?",
  ["Artifacts", "Access packages", "Azure Policy", "Azure Blueprints"], 3,
  "Le dump retient Azure Blueprints (packages d'artefacts : rôles, policies, templates) pour déployer à grande échelle sur plusieurs abonnements avec des référentiels comme ISO 27001.",
  { rev: "À vérifier : Azure Blueprints est annoncé comme déprécié (juillet 2026) au profit de Template Specs, Deployment Stacks et des accélérateurs de landing zone. Azure Policy seule applique des règles mais ne déploie pas l'environnement." });

F(D_GOV, "You need continuous export of Defender for Cloud regulatory compliance data. Which export option should you recommend for each requirement?",
  [["Export at the resource group level", ["Configure export by using the Azure portal", "Configure export by using Azure Policy", "Configure export by using the Defender REST API"], 2],
   ["Export to Azure Logic Apps", ["Configure export by using the Azure portal", "Configure export by using Azure Policy", "Configure export by using the Defender REST API"], 2]],
  "Seule l'API REST de Defender for Cloud permet l'export continu au niveau du groupe de ressources et vers Logic Apps. Le portail et Azure Policy se limitent au niveau abonnement.", { note: RECO });

S(D_ID, "Your company has a Microsoft Entra ID tenant. An external contractor will provide managed SOC services. Both organizations must collaborate in Microsoft Teams. Requirements: accounts managed by administrators in each tenant, users from both organizations have access to a shared Teams channel, access uses single sign-on. What should you use?",
  ["Microsoft Entra B2B collaboration (guest accounts)", "Azure AD B2C", "B2B direct connect", "Self-service sign-up"], 2,
  "B2B direct connect établit une relation de confiance mutuelle entre deux tenants : chaque utilisateur reste géré dans son propre tenant, avec SSO, et peut accéder aux canaux partagés Teams.",
  { note: "Le schéma de la question (exhibit) n'est pas lisible ; les mauvaises options sont reconstituées." });

M(D_NET, "You are securing an IoT solution deployed in a public space. The devices are susceptible to physical manipulation. You need to ensure device integrity, prevent unauthorized access and ensure secure communication. What three actions should you recommend?",
  ["Deploy tamper-proof hardware.", "Use TLS 1.1 for encrypted communication between devices and IoT Hub.", "Implement device authentication using X.509 certificates.", "Ensure the devices are open-source, enabling community contributions and updates.", "Regularly update device firmware."], [0, 2, 4],
  "Matériel anti-effraction (intégrité physique), authentification des appareils par certificats X.509 et mises à jour régulières du firmware. TLS 1.1 est obsolète et l'open source n'apporte pas de garantie de sécurité en soi.");

F(D_OPS, "You design a monitoring solution with Azure Monitor that categorizes data by its source. Which data source corresponds to each description?",
  [["Data about performance and functionality", ["Application", "Infrastructure", "Azure Platform", "Custom Sources"], 0],
   ["Data about containers and guest OS", ["Application", "Infrastructure", "Azure Platform", "Custom Sources"], 1],
   ["Data about tenant-level operations", ["Application", "Infrastructure", "Azure Platform", "Custom Sources"], 2],
   ["Data that uses Azure Monitor REST APIs to send log data to Azure Monitor", ["Application", "Infrastructure", "Azure Platform", "Custom Sources"], 3]],
  "Application = performances et fonctionnement de l'appli ; Infrastructure = conteneurs et OS invité ; Azure Platform = opérations au niveau tenant/abonnement ; Custom Sources = données envoyées via l'API REST d'Azure Monitor.");

F(D_DATA, "Protected health information is stored in Azure Storage and displayed through web forms. You must now address data display requirements. Which display method should you recommend for each use case?",
  [["To permanently replace the original data", ["Masking", "Tokenization", "Hashing", "Encryption"], 0],
   ["To replace the original data with data in the same format", ["Masking", "Tokenization", "Hashing", "Encryption"], 1],
   ["To convert the data to fixed-length, irreversible output", ["Masking", "Tokenization", "Hashing", "Encryption"], 2]],
  "Le masquage remplace définitivement la donnée ; la tokenisation la remplace par un jeton de même format (correspondance conservée dans un coffre chiffré) ; le hachage produit une empreinte de longueur fixe et irréversible. Le chiffrement est réversible et n'est pas la bonne réponse ici.");

F(D_NET, "Your company has Microsoft Defender for Business. You need a secure internet access design. Which security control should you include for each requirement?",
  [["Block access to social networking and chat sites", ["Web content filtering", "Web threat protection", "Custom indicators"], 0],
   ["Block access to phishing sites", ["Web content filtering", "Web threat protection", "Custom indicators"], 1]],
  "Le filtrage de contenu web bloque par catégories (réseaux sociaux, messagerie instantanée…). La protection contre les menaces web bloque les sites de phishing, malware et exploits connus. Les indicateurs personnalisés bloquent des URL, domaines ou fichiers précis.", { note: RECO });

S(D_GOV, "Using the Cloud Adoption Framework Secure methodology, under which security discipline does establishing a Zero Trust access model for modern and legacy assets using identity and networking controls sit?",
  ["Security governance", "Access control", "Asset protection", "Security operations"], 1,
  "Dans la méthodologie Secure du CAF, la discipline « Access control » (contrôle d'accès) établit le modèle Zero Trust par des contrôles d'identité et de réseau.");

M(D_GOV, "An organization wants to secure data at rest and in transit, enforce strong access control and keep an efficient incident response capability. Which two strategies should you recommend?",
  ["Focus on Security Information and Event Management (SIEM).", "Focus on data plane security controls.", "Focus on security of network boundaries.", "Focus on protecting privileged user accounts.", "Focus on management plane security controls."], [1, 4],
  "Le dump retient les contrôles du plan de données (protection des données au repos et en transit) et ceux du plan de gestion (contrôle d'accès et opérations sur les ressources).");

S(D_OPS, "After a known virus infected a server VM, the administration team deployed off-the-shelf anti-malware with daily signature updates, but the server suffers a zero-day infection. You need a design that mitigates similar future attacks. Which recommendation should you include?",
  ["Create a Microsoft Sentinel playbook.", "Create an anomaly detection policy.", "Create a firewall application rule.", "Create an application security group."], 1,
  "Un antivirus à signatures ne détecte pas un zero-day ; il faut une détection comportementale (anomalies) qui repère des événements suspects sans indicateur connu.",
  { rev: "À vérifier : dans la vraie vie, la réponse idéale serait un EDR/détection comportementale (Defender for Endpoint). Parmi ces quatre choix, celui du dump est la seule détection comportementale." });

S(D_ID, "The company configured Conditional Access requiring MFA for all sign-ins outside the corporate LAN with a named location, but employees are prompted for MFA regardless of their location. What should you recommend so users are prompted only when not on the corporate LAN?",
  ["Ensuring that the location has been configured as a trusted location", "Ensuring users have the Microsoft Authenticator mobile app installed", "Ensuring that the option to determine location by IP address is configured", "Ensuring that the option to determine location by GPS coordinates is enabled"], 0,
  "Pour exclure le réseau d'entreprise de l'exigence MFA, l'emplacement nommé doit être marqué « approuvé » (trusted) et exclu dans la condition de la stratégie d'accès conditionnel.");

S(D_DEV, "Some developers reference container images with the 'latest' tag. You need a solution that aligns container image security with best practices. What should you do?",
  ["Pull container images using their digest to ensure the exact version is used.", "Always specify the image tag 'latest' when pulling images from public repositories.", "Enable auto-updates for container images to ensure the latest security patches are applied.", "Use only private container registries and avoid public repositories altogether."], 0,
  "Le digest (SHA-256) identifie de façon immuable le contenu exact de l'image, alors qu'un tag comme latest peut être réaffecté à une autre version.");

F(D_DATA, "A government engineering contract imposes strict data handling guidelines. Which key type should you implement in each case?",
  [["Data subject to eDiscovery", ["Microsoft-managed keys", "Bring your own key (BYOK)", "Double Key Encryption (DKE)"], 1],
   ["Keys that must be held within a defined geographical boundary", ["Microsoft-managed keys", "Bring your own key (BYOK)", "Double Key Encryption (DKE)"], 2],
   ["Keys that must be stored in your data center", ["Microsoft-managed keys", "Bring your own key (BYOK)", "Double Key Encryption (DKE)"], 2]],
  "BYOK convient aux données soumises à eDiscovery (le service doit pouvoir les lire). DKE utilise deux clés dont l'une reste chez vous, dans la zone géographique ou le datacenter de votre choix, de sorte que Microsoft ne peut pas déchiffrer seul.", { note: RECO });

S(D_OPS, "An auditor reports that management ports on some VMs were not secured properly. Management wants to understand how this vulnerability might have been exploited. You need to determine the MITRE ATT&CK tactics and techniques an attacker may have used. What should you do?",
  ["Review the vulnerability in Azure Resource Graph Explorer.", "Review the security initiative for VM management ports.", "Review the associated Defender for Cloud recommendation.", "Review the Quick Fix recommendations for the finding."], 2,
  "Les recommandations de Defender for Cloud sont mappées aux tactiques et techniques MITRE ATT&CK : la page de la recommandation indique comment l'attaquant aurait pu exploiter la faille.");

M(D_ID, "CompanyA (health services, mobile workforce): you need to recommend a solution for managing client data accessed by and stored on mobile devices. Which two should you include?",
  ["User and Entity Behavior Analytics (UEBA)", "App protection policies (APP)", "User risk policies", "Conditional Access policies", "App Control for Business policies"], [1, 3],
  "Les stratégies de protection des applications (APP) contrôlent les données dans les applications sur appareils mobiles ; l'accès conditionnel conditionne l'accès aux ressources selon l'appareil et le contexte.");

Y(D_NET, "CompanyA: which protocols are available for point-to-site (P2S) connections based on the operating system each client uses?",
  ["Android, iOS, Windows, Linux, and macOS systems can connect using OpenVPN.", "Only Windows devices can connect using Secure Socket Tunneling Protocol (SSTP).", "Only Windows and macOS devices can connect using Internet Key Exchange version 2 (IKEv2) VPN."], [0, 0, 1],
  "OpenVPN fonctionne sur tous les systèmes cités. SSTP n'est pris en charge que sur Windows. IKEv2 n'est pas limité à Windows et macOS : il fonctionne aussi sur Linux, Android et iOS.");

F(D_ID, "CompanyA: you need to mitigate the risks presented by Virtual Desktop Infrastructure (VDI). Which solution should you recommend for each requirement?",
  [["To allow only reputable apps to run", ["App Control for Business", "AppLocker", "AppLocker or App Control for Business"], 0],
   ["To manage apps that only run on Windows 8.1", ["App Control for Business", "AppLocker", "AppLocker or App Control for Business"], 1],
   ["To block .ps1, .vbs, and .js scripts", ["App Control for Business", "AppLocker", "AppLocker or App Control for Business"], 2],
   ["To control which apps a user can use", ["App Control for Business", "AppLocker", "AppLocker or App Control for Business"], 1]],
  "App Control for Business (WDAC) s'appuie sur l'Intelligent Security Graph pour n'autoriser que les applications réputées, mais exige Windows 10+. AppLocker gère Windows 8.1 et le contrôle par utilisateur ; les deux peuvent bloquer des scripts.", { note: RECO });

S(D_OPS, "CompanyA: you need to recommend a solution for addressing server vulnerabilities. What should you recommend?",
  ["Deploying a network-based intrusion prevention system (NIPS) behind the server VLAN firewall", "Installing a host-based intrusion detection system (HIDS)", "Enabling data execution prevention on each server", "Uninstalling unused applications and services"], 3,
  "Réduire la surface d'attaque en désinstallant les applications et services inutiles supprime directement des vulnérabilités. NIPS et HIDS détectent, DEP n'est qu'une atténuation partielle.");

S(D_NET, "CompanyA: you need to recommend a solution for protecting SSH access to server VMs. What should you include?",
  ["Just-in-time access", "Azure Bastion", "Network security groups", "Forced tunneling"], 1,
  "Azure Bastion fournit un accès SSH/RDP protégé par TLS depuis le portail, sans exposer de port public sur les VM.",
  { rev: "À vérifier : le just-in-time access de Defender for Cloud protège aussi SSH en ouvrant le port à la demande. Le dump retient Bastion." });

S(D_OPS, "Solution evaluation. Your organization is part of a consortium that performs threat hunting. You need to design a solution that allows cyber threat intelligence (CTI) feeds to be shared automatically between member threat intelligence platforms (TIPs), using industry-accepted formats and protocols supported by Microsoft Sentinel. Solution: You register an app and grant API permissions to the app in Entra ID. You use the client secret provided during registration to add the TIP source. Does this solution meet the goal?",
  ["Yes", "No"], 1,
  "Il manque l'identifiant d'application (client) et l'identifiant du répertoire (tenant) en plus du secret client : les trois sont requis pour connecter la source TIP à Sentinel.");

S(D_OPS, "Solution evaluation (same scenario: share CTI between TIPs automatically with Microsoft Sentinel). Solution: You retrieve the API Root and Collection ID for the TIP server and configure a data connector in your target workspace. Does this solution meet the goal?",
  ["Yes", "No"], 0,
  "Le connecteur TAXII de Sentinel (STIX/TAXII, protocole standard) nécessite l'API Root et l'ID de collection du serveur TIP : la solution est valide.");

S(D_OPS, "Solution evaluation (same scenario). Solution: You define an app registration on the TIP source and specify Microsoft Sentinel as the target product. You provide an application ID and client secret to the TIP source. Does this solution meet the goal?",
  ["Yes", "No"], 1,
  "L'identifiant de répertoire (tenant) est également nécessaire avant de pousser les indicateurs de la TIP vers Sentinel via l'API Microsoft Graph tiIndicators.");

M(D_GOV, "You use Microsoft Defender for Cloud and want the controls with the greatest impact on your Secure Score before a government audit. Which two controls should you recommend?",
  ["Remediate outstanding vulnerabilities on internet-facing servers.", "Install system updates on internet-facing web servers.", "Ensure that improper security configurations have been resolved.", "Enable MFA for users that manage the Azure subscription.", "Secure management ports with network security groups (NSGs)."], [3, 4],
  "Activer la MFA pour les comptes qui administrent l'abonnement et sécuriser les ports de gestion sont les contrôles qui rapportent le plus de points dans le score de sécurité Defender for Cloud.");

M(D_NET, "A VNet hosts a web application on an Azure VM. The VM has outbound internet access. The VM must be reachable from the internet using standard web services only; all other services must be prohibited; VMs added later must not be reachable from the internet. Which two steps should you include?",
  ["Assign a public IP address to the web server's network interface.", "Create a NSG and define inbound rules for web traffic.", "Create an application security group and assign a public IP.", "Deploy Azure Firewall and create an application rule.", "Deploy a NAT gateway and configure the VMs' private IPs."], [0, 1],
  "L'adresse IP publique sur la carte réseau du serveur web l'expose, et le NSG limite l'entrée aux flux web ; les futures VM sans IP publique restent inaccessibles depuis Internet.");

S(D_GOV, "Which Microsoft Cloud Adoption Framework security discipline must the Dev team adhere to before they can adopt DevOps models?",
  ["Innovation Security", "Security Governance", "Security Operations", "Access Control"], 0,
  "Dans le CAF, la discipline « Innovation Security » (sécurité de l'innovation / DevSecOps) doit être respectée avant l'adoption de modèles DevOps.");

S(D_ID, "Each employee has a dedicated Azure virtual desktop managed by the department's IT administrator. You need a design that lets IT administrators manage VMs in any department while minimizing administrative overhead. Which authorization method should you recommend?",
  ["Resource-based", "Scope-based", "Subscription-based", "Role-based"], 3,
  "Le contrôle d'accès basé sur les rôles (RBAC) permet d'affecter des rôles prédéfinis (par ex. Virtual Machine Contributor) sur plusieurs départements avec peu de gestion.");

/* ===== Dump importé (partie B) : questions 61 à 113 du document ===== */
F(D_OPS, "Your security team spends too much time manually searching for threat vectors and responding to low-level events (Entra ID, Azure Firewall, Defender for Cloud). You propose Microsoft Sentinel. Which Sentinel-supported technologies or tools should you include in your justification?",
  [["To automate threat responses", ["SOAR", "KQL", "SAST", "SDN", "CDN"], 0],
   ["To correlate and search threat data", ["SOAR", "KQL", "SAST", "SDN", "CDN"], 1]],
  "SOAR (orchestration, automatisation et réponse) automatise les réponses aux menaces via playbooks ; KQL (Kusto Query Language) sert à interroger et corréler les données dans Sentinel.");

F(D_DATA, "A customer migrates Exchange on-premises to Office 365 (staged migration). Which email protection should you recommend for each scenario?",
  [["Emails must be encrypted and sent primarily to customers using Gmail or Outlook.com", ["Microsoft Purview Message Encryption", "Information Rights Management (IRM)", "S/MIME"], 0],
   ["Emails must be encrypted; once sent, they cannot be printed, copied or forwarded", ["Microsoft Purview Message Encryption", "Information Rights Management (IRM)", "S/MIME"], 1],
   ["Emails must be encrypted using PKI certificates; messages must be signable", ["Microsoft Purview Message Encryption", "Information Rights Management (IRM)", "S/MIME"], 2]],
  "Purview Message Encryption fonctionne avec des destinataires sur n'importe quelle messagerie. IRM empêche l'impression, la copie et le transfert. S/MIME repose sur des certificats PKI et permet la signature des messages.", { note: RECO });

S(D_GOV, "You use Microsoft Secure Score. What is the impact of setting an improvement action's status to Risk accepted?",
  ["The improvement action is mitigated via a partner.", "The improvement action is not implemented.", "The improvement action is planned for future implementation.", "The improvement action process is started."], 1,
  "Risk accepted signifie que l'organisation accepte le risque : l'action n'est pas mise en œuvre (et n'est pas planifiée ni traitée par un partenaire).");

S(D_OPS, "You use Microsoft Security Exposure Management and manage attack paths by focusing on choke points. What is the primary outcome of implementing choke points?",
  ["Choke points allow attackers' traffic to be redirected away from critical assets.", "Choke points address multiple intersecting vulnerabilities at critical locations.", "Choke points remove all low priority vulnerabilities from the network.", "Choke points reduce the visibility of attack paths."], 1,
  "Un choke point est un point de convergence de plusieurs chemins d'attaque : le corriger réduit en une seule action de nombreux chemins vers les actifs critiques.");

F(D_ID, "You will create Entra ID Protection policies to identify risky account behavior. Which policy condition should you set for each suspicious behavior?",
  [["Behavior consistent with known attack patterns", ["User risk", "Sign-in risk"], 0],
   ["An anomalous token condition", ["User risk", "Sign-in risk"], 1],
   ["Suspicious inbox rules", ["User risk", "Sign-in risk"], 1]],
  "Selon le corrigé du dump : les comportements correspondant à des schémas d'attaque connus relèvent du risque utilisateur ; le jeton anormal et les règles de boîte de réception suspectes relèvent du risque de connexion.",
  { rev: "À vérifier : dans la documentation Microsoft, « suspicious inbox rules » est une détection de risque utilisateur. Retiens la réponse du dump pour cet examen, mais compare avec la doc si le libellé change." });

S(D_DATA, "Your company processes classified information on hardened on-premises systems and wants to add cloud compute capacity while maintaining maximum security. You need a compute solution that encrypts data in use. Which technology should you recommend to enable confidential computing?",
  ["Software Guard Extensions (SGX) enclaves", "Dedicated Hardware Security Module (HSM)", "Azure Key Vault", "A Trusted Platform Module (TPM)"], 0,
  "Les enclaves SGX isolent code et données dans une zone matérielle du processeur : les données restent protégées en cours d'utilisation, même si l'OS est compromis.");

S(D_GOV, "A research organization plans to use Microsoft Copilot. The security officer is concerned about how the organization's data will be protected from unauthorized access or exposure to competitors. What should you determine?",
  ["Separate physical datacenters for each tenant", "Multi-layered encryption for data at rest and in transit", "Badge-only access for Microsoft employees to datacenters", "Logical isolation through Microsoft Entra"], 3,
  "L'isolation logique des tenants via Microsoft Entra garantit que les données d'une organisation ne sont accessibles qu'à ses propres utilisateurs autorisés.");

S(D_DATA, "You use Azure Storage and Entra ID. You need a design that limits access to blobs based on tags. Which authentication method should you recommend to support role assignment conditions?",
  ["Attribute-Based Access Control (ABAC)", "Mandatory Access Control (MAC)", "Privileged Access Management (PAM)", "Discretionary Access Control (DAC)"], 0,
  "ABAC ajoute des conditions aux attributions de rôles Azure RBAC en fonction d'attributs, comme les balises d'index de blob.");

S(D_DATA, "You configure Azure AI services for a healthcare application that handles sensitive patient data stored longer than 48 hours. You need to protect the confidentiality and integrity of data processed by the AI services, aligned with best practices. What should you do?",
  ["Use built-in encryption provided by Azure AI services.", "Enable Customer Managed Keys (CMK).", "Share API keys with developers through internal channels.", "Allow service access only from trusted IP ranges."], 1,
  "Les clés gérées par le client (CMK) donnent le contrôle du chiffrement au repos et répondent aux exigences de conformité pour les données sensibles conservées au-delà de 48 heures.");

S(D_ID, "While implementing Zero Trust in a Microsoft 365 tenant, you need to define the encryption level and antivirus version that devices must meet before being allowed access to resources. Which policy type should you configure?",
  ["Compliance policy", "Conditional Access policy", "Device configuration profile policy", "Enrollment policy"], 0,
  "Les stratégies de conformité Intune définissent l'état attendu des appareils (chiffrement, version d'antivirus…) ; l'accès conditionnel consomme ensuite cet état pour autoriser ou non l'accès.");

F(D_NET, "Your organization configures Conditional Access in Microsoft Entra. Which Zero Trust principle does each action fulfil?",
  [["Move the control plane to the cloud", ["Verify explicitly", "Use least privilege access", "Assume breach"], 0],
   ["Consider all clients to be external", ["Verify explicitly", "Use least privilege access", "Assume breach"], 0],
   ["Segment network infrastructure", ["Verify explicitly", "Use least privilege access", "Assume breach"], 2],
   ["Move the management plane to the cloud", ["Verify explicitly", "Use least privilege access", "Assume breach"], 2]],
  "Vérifier explicitement : évaluer chaque accès selon identité, appareil, risque (plan de contrôle dans le cloud, tous les clients considérés comme externes). Supposer la compromission : segmenter et limiter l'impact.",
  { note: RECO, rev: "À vérifier : la dernière affectation (plan de gestion dans le cloud → Assume breach) est surprenante ; retiens celle du dump." });

F(D_GOV, "You use Defender for Cloud to evaluate infrastructure compliance. For each purpose, which element should you identify?",
  [["Used to control specific security conditions using rules", ["Security policies", "Security initiatives", "Security recommendations"], 0],
   ["Used to group rules for a specific purpose or goal", ["Security policies", "Security initiatives", "Security recommendations"], 1],
   ["Used to identify remediation prerequisites", ["Security policies", "Security initiatives", "Security recommendations"], 2]],
  "Les stratégies (Azure Policy) contrôlent les conditions ; les initiatives regroupent des stratégies autour d'un objectif ; les recommandations indiquent ce qu'il faut corriger et les prérequis de remédiation.");

F(D_ID, "Enterprise access model: at which level should you work in each scenario?",
  [["To enforce your Zero Trust policy", ["Tier 0", "Tier 1", "Tier 2"], 0],
   ["To facilitate your partners accessing applications in your tenant", ["Tier 0", "Tier 1", "Tier 2"], 2],
   ["To manage assets and the protective monitoring of your estate", ["Tier 0", "Tier 1", "Tier 2"], 1],
   ["To create applications and websites to store business value", ["Tier 0", "Tier 1", "Tier 2"], 1]],
  "Tier 0 = plan de contrôle (identité, politiques d'accès Zero Trust) ; Tier 1 = gestion des actifs et charges de travail ; Tier 2 = accès des utilisateurs, y compris partenaires.",
  { rev: "À vérifier : les correspondances sont celles du dump ; le modèle d'accès d'entreprise officiel parle plutôt de plans (contrôle, gestion, données/charge de travail, accès utilisateur et applicatif) que de tiers." });

S(D_NET, "A real-time stock price app is vulnerable to command injection and remote file inclusion. Requirements: no application code changes, common misconfigurations must be identified, HTTP protocol anomalies must be detected. What should you do?",
  ["Deploy Azure Web Application Firewall (WAF) and configure a bot protection rule set.", "Deploy Azure WAF and enable the CRS 2.2.9 OWASP rule set.", "Deploy Azure WAF with the default managed rule set.", "Deploy Azure WAF and configure Core Rule Set (CRS) 3.1."], 2,
  "Le jeu de règles géré par défaut (Default Rule Set) du WAF Azure couvre les injections de commandes, l'inclusion de fichiers distants et les anomalies HTTP, sans modifier le code. Le jeu bot ne traite pas ces attaques et CRS 2.2.9 / 3.1 sont des versions anciennes.");

S(D_OPS, "The organization must be safeguarded against malicious threats posed by email messages and links. Which Microsoft 365 Defender service should you recommend?",
  ["Defender for Identity", "Defender for Endpoint", "Defender for Office 365", "Defender for Cloud Apps"], 2,
  "Defender for Office 365 protège la messagerie et la collaboration : liens et pièces jointes malveillants, phishing, usurpation.");

S(D_GOV, "Website traffic surged after a product launch. You must ensure the website can handle the surge and maintain availability, following the Azure Well-Architected Framework. What should you do?",
  ["Scale out web servers to distribute the incoming traffic.", "Enhance network performance to reduce latency.", "Scale up web servers to handle more traffic.", "Implement a queuing system to manage incoming requests."], 0,
  "La mise à l'échelle horizontale (scale out) répartit la charge sur plusieurs instances : meilleure disponibilité et résilience qu'un scale up qui garde un point unique de défaillance.");

F(D_OPS, "Microsoft Sentinel is deployed. Which tool should you recommend for each incident management activity?",
  [["Automatically isolate an infected machine", ["Notebook", "Playbook", "Workbook", "Runbook"], 1],
   ["Visualize and monitor threat data", ["Notebook", "Playbook", "Workbook", "Runbook"], 2],
   ["Analyze data with Python machine learning", ["Notebook", "Playbook", "Workbook", "Runbook"], 0]],
  "Le playbook (Logic Apps) automatise la réponse, le workbook visualise les données, le notebook (Jupyter) permet l'analyse avancée en Python et le machine learning.");

F(D_ID, "You use Microsoft Entra Privileged Identity Management (PIM). Which configuration option should you recommend for each requirement?",
  [["Users must successfully complete MFA as part of role activation", ["Eligible", "Active"], 0],
   ["Activated roles should only manage resources in a specific department", ["Administrative unit", "Directory (tenant-wide)"], 0]],
  "Une attribution éligible impose une activation (MFA, justification, approbation). Une unité administrative limite l'étendue du rôle à un sous-ensemble du répertoire, par exemple un service.", { note: RECO });

S(D_DATA, "You migrate a legacy HR management system to Azure VMs running a custom web server. An attacker attempted a downgrade attack. You need a mitigation; data in motion must be protected. What should you do?",
  ["Configure input validation.", "Implement challenge tokens.", "Rekey SSL certificates.", "Disable TLS 1.0 support."], 3,
  "Les attaques par rétrogradation exploitent les protocoles anciens (SSL 3.0, TLS 1.0). Désactiver TLS 1.0 force des versions modernes.");

S(D_ID, "You are securing an Azure environment and implementing best practices for identity and access management. You must comply with multiple frameworks and protect privileged access. After reviewing the landing zone design, what should you do to ensure secure access?",
  ["Enable Microsoft Entra multifactor authentication (MFA) for all users with administrative roles.", "Grant permanent administrative privileges to key personnel.", "Assign administrative roles directly to individual users.", "Require administrators to use shared accounts."], 0,
  "La MFA sur les rôles administratifs est la mesure fondamentale pour protéger les accès privilégiés et satisfaire les référentiels de conformité.");

M(D_GOV, "You enabled Defender for Cloud with enhanced security features. You need the Information Security Officer to be notified by email when a compliance assessment fails. Which two steps should you complete?",
  ["Add a workflow automation.", "Create a dashboard.", "Enable a recommendation.", "Create a logic app.", "Define policy."], [0, 3],
  "Une automatisation de workflow Defender for Cloud déclenche une Logic App en réponse à un événement (ici l'échec d'une évaluation de conformité) ; la Logic App envoie l'e-mail.");

S(D_DATA, "Employees use laptops running Windows 10 or 11. You need to silently enable BitLocker on employee systems. Which process or task should you include?",
  ["Creating an endpoint security policy in Microsoft Intune", "Defining a multi-workload data encryption policy (DEP) in PowerShell", "Submitting a Customer Key activation request in the Fast Track portal", "Running an Intune device encryption report to verify TPM versions"], 0,
  "Une stratégie de sécurité des points de terminaison Intune (chiffrement de disque) active BitLocker silencieusement, sans interaction de l'utilisateur.");

S(D_OPS, "You configure Microsoft Defender for Cloud Apps to enhance visibility and control over cloud applications. You want to automate discovery of cloud applications while grouping them for easier management and ensuring compliance with industry regulations. What should you do?",
  ["Activate Anonymization", "Enable Snapshot Reports", "Use App Tags", "Configure Score Metrics"], 3,
  "Les métriques de score définissent comment les applications découvertes sont évaluées (conformité réglementaire, normes de sécurité) et permettent de prioriser les actions.");

S(D_DEV, "The organization adopted a lifecycle security strategy for application security. You need to ensure that security is a key consideration at every phase of the application's development. Which strategy should you prioritize?",
  ["Regularly review user roles and permissions to enforce least privilege access.", "Focus primarily on security testing after application deployment.", "Limit vulnerability testing to only high-severity issues.", "Implement logging and monitoring to detect incidents as they occur."], 0,
  "Le corrigé du dump retient la revue régulière des rôles et permissions pour appliquer le moindre privilège.",
  { rev: "À vérifier : la journalisation/supervision est aussi une pratique de cycle de vie. Le dump retient la revue des rôles." });

S(D_NET, "Your organization deploys IoT sensors in outdoor public locations that collect sensitive data and transmit it to the cloud. The security team needs a method for robust authentication and secure data transmission. What should the team recommend?",
  ["Use pre-shared keys (PSKs) for device authentication and encrypt communication using TLS 1.3.", "Integrate field gateways to secure legacy devices and offload encryption responsibilities from individual devices.", "Authenticate devices with X.509 certificates and secure communications using TLS 1.2.", "Protect communications with network-layer encryption and eliminate the need for device-level authentication."], 2,
  "Les certificats X.509 (PKI) offrent une authentification robuste des appareils ; TLS 1.2 chiffre les communications de bout en bout. Les clés pré-partagées sont plus faibles et supprimer l'authentification des appareils est inacceptable.");

S(D_DATA, "No DLP policies exist, sensitive information is not clearly defined and no High Severity DLP alerts are configured. You need to create a policy that solves the issues in the report. Which template should you use?",
  ["Data Leaks template", "Security policy violations", "Risky user template", "Data theft by departing users"], 0,
  "Le modèle « Data Leaks » de la gestion des risques internes Purview détecte les fuites de données et s'appuie sur des stratégies DLP et des types d'informations sensibles.");

S(D_DEV, "After a configuration error led to a breach that spread to multiple environments, you must design an Azure landing zone to reduce the risk. You need a process for storing network and system configurations centrally in standardized files, based on DevSecOps best practices. Which option should you recommend?",
  ["Continuous delivery", "Infrastructure as code", "Continuous integration", "Infrastructure automation"], 1,
  "L'infrastructure as code (Bicep, Terraform, ARM) décrit les configurations dans des fichiers standardisés et versionnés, ce qui rend les déploiements répétables et auditables.");

M(D_DEV, "You plan to migrate all compute operations to a Docker-based installation. You need to ensure the new platform is secure by minimizing the risk of unknown vulnerabilities. Which two design requirements should you recommend?",
  ["Configure hypervisor policies that only allow trusted processes.", "Require that all images come from a private trusted registry.", "Integrate the platform with Microsoft Defender for Cloud.", "Implement full-disk encryption on each VM.", "Create an endpoint security policy in Microsoft Endpoint Manager."], [1, 2],
  "Un registre privé de confiance garantit la provenance des images ; Defender for Cloud analyse les vulnérabilités des conteneurs et des images.");

F(D_DATA, "A web app processes financial data. Data kept in Azure Storage must be encrypted using app-specific keys; when accessed, it is decrypted with the app-specific key and re-encrypted before being sent to its destination. What should you recommend?",
  [["To generate and manage certificates", ["Implement Azure Key Vault", "Implement managed HSM pools"], 0],
   ["To decrypt and re-encrypt Storage data", ["Encrypt the data with the destination node's public key", "Encrypt the data with the source node's private key"], 0]],
  "Azure Key Vault génère et gère les certificats (infrastructure PKI). Les données sont rechiffrées avec la clé publique du nœud destinataire : seul le détenteur de la clé privée correspondante pourra les lire.", { note: RECO });

F(D_OPS, "You use Microsoft Sentinel and need closed incidents to be searchable for future incidents. Which classification should you recommend for each scenario?",
  [["A user signs in after hours to access a sensitive document in preparation for a shareholder meeting", ["True Positive", "Benign Positive", "False Positive"], 1],
   ["A penetration tester triggers a file integrity monitoring alert on a protected file server", ["True Positive", "Benign Positive", "False Positive"], 1],
   ["A contractor sends proprietary product blueprints to a personal email address", ["True Positive", "Benign Positive", "False Positive"], 0]],
  "Benign Positive : activité suspecte détectée correctement mais attendue et inoffensive (sortie hors horaires, test d'intrusion). True Positive : vrai incident de sécurité (fuite de plans). False Positive : alerte déclenchée à tort.");

S(D_DATA, "PII and PHI are stored in Microsoft 365 and Azure and must receive special handling. You need to protect this data in motion and at rest. What should you recommend?",
  ["Define sensitivity labels and configure protection settings.", "Deploy X.509 certificates on servers and configure TLS.", "Configure a Data Loss Prevention (DLP) policy for sensitive documents.", "Enable BitLocker on all file servers and user workstations."], 0,
  "Les étiquettes de confidentialité avec paramètres de protection (chiffrement, droits) suivent le document partout, donc au repos et en transit. TLS, DLP ou BitLocker ne couvrent chacun qu'une partie.");

F(D_GOV, "You use Microsoft Purview Compliance Manager. How would you define each Compliance Score component?",
  [["Defines how configurations, processes and people are managed", ["Assessment", "Control", "Group", "Template"], 1],
   ["Groups the actions that are required to fulfil a regulation, standard or law", ["Assessment", "Control", "Group", "Template"], 0],
   ["Organizes assessments by standard, organizational teams, or service", ["Assessment", "Control", "Group", "Template"], 2]],
  "Contrôle = règle de gestion des configurations, processus et personnes ; évaluation (assessment) = regroupement des actions nécessaires pour une réglementation ; groupe = organisation des évaluations par norme, équipe ou service.");

S(D_GOV, "Microsoft released a posture update to the baseline with settings that address ransomware tactics. You have tested the settings. What should you recommend to deploy the updated baseline across the enterprise?",
  ["Microsoft Intune", "Microsoft Operational Security Assurance (OSA)", "Microsoft Purview", "Windows Autopilot"], 0,
  "Les profils de référence de sécurité (security baselines) de Microsoft Intune se déploient de façon centralisée sur les appareils gérés.");

M(D_DATA, "A health services provider uses custom Azure-hosted APIs. Requirements: data encrypted in motion and at rest, verifiably secure encryption keys, keys stored so that they cannot be extracted. Which two tasks should you recommend?",
  ["Deploy managed Hardware Security Module (HSM) pools to securely handle cryptographic operations for systems that process sensitive information.", "Implement OAuth and enforce JWT-based encryption on all communications.", "Use Azure Key Vault to request and manage trusted X.509 certificates for the APIs from a trusted Certificate Authority.", "Ensure that data exchanges between security domains require Azure AD-based SAML.", "Generate HMAC-based One-Time Passwords (HOTPs) for each transaction using a secret and a counter."], [0, 2],
  "Les pools HSM managés stockent les clés de façon non extractible (matériel validé FIPS 140). Key Vault gère les certificats X.509 d'une autorité de confiance pour chiffrer les communications.");

S(D_GOV, "You design a business continuity and disaster recovery (BCDR) plan for application workloads in Azure. You need a recommendation to support BCDR best practices, ensuring minimal disruption and effective failover. What should you do?",
  ["Implement Azure Site Recovery for Azure-to-Azure VM disaster recovery scenarios.", "Use overlapping IP address ranges in production networks and disaster recovery (DR) networks.", "Configure single region and peering location for ExpressRoute.", "Implement third-party backup solutions to increase backup flexibility."], 0,
  "Azure Site Recovery réplique les VM vers une autre région et automatise le basculement. Des plages IP qui se recouvrent compliquent le failover et un seul emplacement ExpressRoute crée un point de défaillance unique.");

F(D_NET, "Azure Front Door serves static images and videos stored in Azure Storage (see exhibit). Which WAF configuration meets each requirement?",
  [["To restrict access to your content by region", ["Geo-filtering policy", "Bot protection rule set", "IP restriction rule", "Rate limit rule"], 0],
   ["To throttle requests from a client IP address", ["Geo-filtering policy", "Bot protection rule set", "IP restriction rule", "Rate limit rule"], 3]],
  "Le filtrage géographique autorise ou bloque par pays/région ; la règle de limitation de débit plafonne le nombre de requêtes par IP sur une période (les requêtes restent autorisées mais limitées).", { note: RECO });

O(D_OPS, "You need to access a specific threat intelligence report in Microsoft Defender for Cloud. Which three actions should you perform, in sequence?",
  ["From the Defender for Cloud sidebar, open the Overview page.", "From the Alert details page, select the Next: Take Action button.", "From the Defender for Cloud sidebar, open the Security alerts page.", "Select an alert.", "From the Alert details page, select the link to the report."], [2, 3, 4],
  "On ouvre la page Security alerts, on sélectionne une alerte, puis on suit dans les détails de l'alerte le lien vers le rapport de renseignement sur les menaces (PDF).");

S(D_NET, "A company wants a solution that acts as a secure web gateway and provides secure access to all internet and SaaS apps. Which solution should you use?",
  ["Microsoft Entra Internet Access", "Virtual Private Network (VPN)", "Microsoft Defender for Cloud Apps", "Azure Firewall"], 0,
  "Microsoft Entra Internet Access (Global Secure Access) est la passerelle web sécurisée (SWG) de Microsoft pour Internet et les applications SaaS.");

M(D_ID, "You plan a BYOD policy with devices running iOS or Android, some managed by third-party MDM solutions. You need a solution that limits unintentional or intentional data loss. Which two statements should you include?",
  ["App protection policies can prevent all data sharing between apps on a device.", "App protection policies are compatible with third-party mobile device management (MDM) solutions.", "App protection policies can encrypt all locally stored device data.", "App protection policies allow app deployment to third-party MDM devices."], [0, 1],
  "Les stratégies de protection des applications contrôlent le partage de données entre applications et fonctionnent indépendamment de l'MDM (y compris tiers). Elles ne chiffrent pas tout l'appareil et ne déploient pas d'applications.");

S(D_ID, "The company is implementing Microsoft's Zero Trust model to limit access to authorized users and devices and proactively monitor threats. What should you do first?",
  ["Migrate all applications to single sign-on (SSO) solution.", "Do security checks on identity verification and device health.", "Establish a security operations center (SOC) to handle threat detection.", "Implement role-based access control (RBAC) to manage permissions."], 1,
  "Zero Trust commence par vérifier explicitement l'identité et l'état de santé de l'appareil avant d'accorder l'accès.");

S(D_GOV, "Azure Backup protects on-premises Windows VMs with incremental backups and locally redundant storage (LRS). A security audit requires on-premises VMs to be protected and replicated across availability zones to guarantee data residency and resiliency in the same region. What should you do?",
  ["Configure geo-redundant storage (GRS) for the recovery vault.", "Leave the configuration as locally redundant storage (LRS).", "Configure zone-redundant storage (ZRS) for the recovery vault.", "Configure geo-zone-redundant storage (GZRS) for the recovery vault."], 2,
  "ZRS réplique entre zones de disponibilité dans la même région, ce qui garantit résidence des données et résilience. GRS/GZRS copient vers une région secondaire, non demandée.");

O(D_ID, "You deploy Zero Trust within a Microsoft 365 tenant. Which five actions should you perform, in sequence?",
  ["Add Zero Trust identity and device access protection.", "Enroll the devices in Intune.", "Configure identity and device access protection.", "Evaluate, pilot, and deploy Microsoft 365 Defender.", "Implement Microsoft Purview Information Protection."], [2, 1, 0, 3, 4],
  "Ordre du dump : configurer la protection des identités et des accès, inscrire les appareils dans Intune, ajouter la protection Zero Trust identité/appareil, évaluer et déployer Microsoft 365 Defender, puis mettre en œuvre Purview Information Protection.",
  { note: "Les distracteurs éventuels de la question d'origine ne sont pas visibles ; seules les cinq étapes correctes sont proposées." });

S(D_DATA, "Cloud workloads run on shared hypervisors; management is concerned about process-level security on database and transaction processing servers. Which recommendation should you include?",
  ["Deploy Azure WAF and ensure that OWASP core rule sets are enabled.", "Move sensitive processes to a trusted execution environment (TEE) platform.", "Move all database and transaction processing servers to the same NSG.", "Implement managed HSM pools for servers running sensitive processes."], 1,
  "Un environnement d'exécution de confiance (TEE) isole matériellement les processus sensibles, même sur un hyperviseur partagé.");

M(D_DATA, "A web app on Azure App Service risks a compromised private key having a cascading effect on all user encryption keys. You need to enhance cryptographic security by implementing a trust model. Which two actions should you recommend?",
  ["Issue a certificate to a subordinate CA.", "Escrow user certificates with a third party.", "Issue user certificates from a subordinate CA.", "Pin user certificates with multiple CAs.", "Issue a master certificate to a root CA."], [0, 2],
  "Une hiérarchie PKI à plusieurs niveaux limite l'impact : la CA racine délègue à une CA subordonnée, qui émet les certificats utilisateur ; la compromission d'une clé subordonnée n'invalide pas toute la chaîne.");

S(D_DATA, "You use Azure Blob Storage to store off-site copies of sensitive financial data and recommend customer-provided keys for granular control over encryption operations. What key implementation method should you recommend?",
  ["Uploading the key to Azure Key Vault", "Enabling the key in a managed Hardware Security Module (HSM)", "Linking the key to the Azure key vault", "Including the key in a request header"], 3,
  "Avec une clé fournie par le client pour Blob Storage, la clé est transmise dans l'en-tête de chaque requête ; Azure ne la conserve pas.");

S(D_ID, "For a hybrid infrastructure, you design a Zero Trust policy enforcement solution that facilitates access control for assets in line with the enterprise access model. Where does Zero Trust policy enforcement align?",
  ["Management plane", "Control plane", "User access", "Data plane"], 1,
  "L'application de la politique Zero Trust et la vérification d'identité relèvent du plan de contrôle du modèle d'accès d'entreprise.");

M(D_GOV, "You design an Azure landing zone and must achieve a security baseline as quickly as possible. Which three Microsoft tools should you recommend?",
  ["Microsoft Defender for Cloud", "Exchange Online", "Privileged Identity Management (PIM)", "Azure Firewall", "Route tables"], [0, 2, 3],
  "Defender for Cloud (posture et protection), PIM (accès privilégiés juste-à-temps) et Azure Firewall (filtrage réseau) établissent rapidement une base de sécurité d'une landing zone.");

S(D_DATA, "Employees send sensitive medical records by email. Requirements: only intended recipients can view content; employees can send secure email to Gmail, Yahoo!, Outlook.com users. You plan to implement Microsoft Purview Message Encryption. What should you recommend first?",
  ["Verify that Azure RMS has been activated.", "Define mail flow rules in the Exchange admin center.", "Create and publish sensitivity labels."], 0,
  "Purview Message Encryption repose sur Azure Rights Management : il faut d'abord vérifier qu'Azure RMS est activé avant de définir règles de flux ou étiquettes.",
  { note: "Il manque peut-être une option dans la capture ; la bonne réponse reste la première." });

S(D_ID, "Your organization uses Microsoft Entra joined devices and a centralized management system. IT wants to implement Windows LAPS to improve local administrator password security. How should you deploy LAPS in the best possible way?",
  ["Use the direct registry modification deployment.", "Use the Windows LAPS Group Policy deployment.", "Use Microsoft Intune with the Windows LAPS CSP deployment.", "Use the Local Computer Group Policy LAPS enforcement deployment."], 2,
  "Pour des appareils joints à Microsoft Entra, Intune configure Windows LAPS de façon centralisée via le fournisseur de services de configuration (CSP) Windows LAPS.");

F(D_NET, "Case study (CompanyA, e-commerce). You need to design a solution that ensures the e-commerce application is secure. Which Azure Firewall rule type should you recommend to meet each requirement?",
  [["To facilitate customer access to the API endpoint", ["Application rule", "Network rule", "DNAT rule and network rule"], 2],
   ["To facilitate contractor access to the database server", ["Application rule", "Network rule", "DNAT rule and network rule"], 2],
   ["To facilitate transaction server access to the credit card processor", ["Application rule", "Network rule", "DNAT rule and network rule"], 1]],
  "L'accès entrant depuis Internet vers une ressource privée exige une règle DNAT (traduction d'adresse publique → privée) associée à une règle réseau qui autorise le port. L'accès sortant vers le processeur de cartes ne demande qu'une règle réseau (TCP sur le port concerné).", { note: RECO });

S(D_DATA, "Case study (CompanyA). You must secure the e-commerce database after a SQL injection attack let a malicious user modify database content. What should you include in your recommendation?",
  ["The web development team should run all submitted user requests through a link checker.", "The web development team should add input validation functions to the shopping cart page.", "The system security team should require TLS on all servers that host web content.", "The DBA should enable data execution prevention on all servers hosting website data."], 1,
  "La validation des entrées empêche l'exécution d'instructions SQL malveillantes insérées dans les champs de formulaire. Un vérificateur de liens traite le phishing, TLS protège le transport et DEP vise la mémoire.");

M(D_NET, "Case study (CompanyA). You design a solution for access to Cosmos DB. Requirements: extend the on-premises network into Azure, bypassing the internet; provide access to a single database instance. Which two technologies or components should you recommend?",
  ["Virtual network TAP", "Private Link", "Service endpoint", "ExpressRoute"], [1, 3],
  "ExpressRoute prolonge le réseau on-premises dans Azure par une connexion privée sans passer par Internet ; Private Link expose une seule instance de base de données via un point de terminaison privé.");

S(D_DATA, "Case study (Synapse). You need to ensure the Synapse deployment meets Azure Security Benchmark baseline requirements: each resource (dedicated SQL pools, serverless SQL endpoints) must be accessible via a managed private endpoint. Solution: You recommend creating a Managed Virtual Network Workspace and that all dedicated and serverless pools should be located in the workspace. Does this solution meet the goal?",
  ["Yes", "No"], 0,
  "Un espace de travail à réseau virtuel managé (Managed Virtual Network Workspace) est le prérequis pour utiliser des points de terminaison privés managés avec Synapse.");

S(D_DATA, "Case study (Synapse, same goal). Solution: You recommend creating separate VNets for dedicated SQL pools and serverless SQL endpoints, connected using Azure ExpressRoute. Does this solution meet the goal?",
  ["Yes", "No"], 1,
  "Des VNet séparés reliés par ExpressRoute ne donnent pas accès à des points de terminaison privés managés : il faut un Managed Virtual Network Workspace.");

S(D_DATA, "Case study (Synapse, same goal). Solution: You recommend deploying all SQL nodes in a common virtual network and creating a P2S connection between each endpoint and Azure Synapse Analytics. Does this solution meet the goal?",
  ["Yes", "No"], 1,
  "Une connexion VPN point à site relie un poste unique à un VNet ; elle ne fournit pas de point de terminaison privé managé, qui exige un Managed Virtual Network Workspace.");

Y(D_GOV, "You are asked how to increase the Secure Score for production environments. For each statement, select Yes if it is true.",
  ["Using customer-managed keys to encrypt data in SQL Managed Instances will improve your Secure Score.", "Changing an improvement action to the Risk accepted status will NOT reduce your Secure Score.", "Based on Secure Score, you can use Defender for Cloud to automatically delete resources with security misconfigurations."], [1, 0, 1],
  "Le chiffrement par clé client n'est pas une recommandation qui fait gagner des points ici ; l'acceptation du risque ne retire pas de points déjà acquis ; Defender for Cloud ne supprime jamais automatiquement des ressources mal configurées.",
  { rev: "À vérifier : le dump répond Non à la première affirmation ; si l'examen détaille une recommandation CMK sur SQL MI, le résultat pourrait différer." });

F(D_DATA, "You migrate on-premises SQL Servers to Azure SQL Database and Azure SQL Managed Instance. Which feature should you implement for each requirement?",
  [["To encrypt data and log files", ["Always Encrypted", "Ledger", "TDE", "TDS"], 2],
   ["To maintain a history of all database changes over time", ["Always Encrypted", "Ledger", "TDE", "TDS"], 1],
   ["To prevent database admins from accessing sensitive data", ["Always Encrypted", "Ledger", "TDE", "TDS"], 0]],
  "TDE chiffre les fichiers de données et de journaux au repos ; Ledger conserve l'historique inviolable des modifications ; Always Encrypted empêche même les administrateurs de bases de lire les données sensibles (clés côté client).");

S(D_DEV, "All Azure Virtual Desktop VMs run Windows 11. You need a design that mitigates application-associated risks and uses threat intelligence so that only applications with a known good reputation are allowed to run. Which recommendation should you include?",
  ["Configure the Application Control for Windows policy.", "Deploy Microsoft Defender Application Guard.", "Create an AppLocker policy.", "Enable software restriction policies (SRP)."], 0,
  "Application Control (WDAC) peut s'appuyer sur l'Intelligent Security Graph pour n'autoriser que les applications à bonne réputation. AppLocker et SRP ne s'appuient pas sur la réputation.");

S(D_OPS, "You use Defender for Cloud, Entra ID, Azure Key Vault and AKS. Your manager wants a unified solution for security analytics and threat intelligence by integrating the services with Microsoft Sentinel. Which built-in onboarding method should you use?",
  ["Configure Syslog.", "Enable the built-in connectors to the cloud-native services.", "Create REST APIs."], 1,
  "Sentinel propose des connecteurs de données natifs pour les services Azure et Microsoft : c'est la méthode d'intégration intégrée la plus simple.");
