<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Simulateur SC-100</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one centered working column. Home stacks cards, quiz shows one question at a time, results end on a per-domain review. */
:root {
  --bg: #F2F5F7; --surface: #FFFFFF; --ink: #13202A; --muted: #566876; --line: #D5DDE3;
  --accent: #0E6B78; --accent-ink: #FFFFFF; --accent-soft: #DDF0F2;
  --ok: #1B7A44; --ok-soft: #E0F3E8; --bad: #B2342B; --bad-soft: #FBE7E4; --warn: #7A5400; --warn-soft: #FBF0D3;
  --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D141A; --surface: #151F27; --ink: #E5ECF1; --muted: #8FA2B1; --line: #27343F;
    --accent: #55C2CF; --accent-ink: #07242A; --accent-soft: #12323A;
    --ok: #5CCB8A; --ok-soft: #12301F; --bad: #F08A80; --bad-soft: #3A1C19; --warn: #E3B34A; --warn-soft: #33280F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D141A; --surface: #151F27; --ink: #E5ECF1; --muted: #8FA2B1; --line: #27343F;
  --accent: #55C2CF; --accent-ink: #07242A; --accent-soft: #12323A;
  --ok: #5CCB8A; --ok-soft: #12301F; --bad: #F08A80; --bad-soft: #3A1C19; --warn: #E3B34A; --warn-soft: #33280F;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.5;
  padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
#app { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
h1 { font-size: clamp(1.7rem, 5vw, 2.3rem); line-height: 1.1; margin: 0 0 8px; letter-spacing: -0.02em; text-wrap: balance; }
h2 { font-size: 1.05rem; margin: 0 0 12px; }
p { margin: 0; }
.lead { color: var(--muted); max-width: 60ch; }
.sub { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 16px 0 8px; font-weight: 600; }
.hero .sub { margin-top: 0; }
.small { font-size: .85rem; color: var(--muted); margin-top: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; min-width: 0; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.stats > div { background: var(--surface); padding: 12px 16px; display: flex; flex-direction: column; }
.num { font-size: 1.6rem; font-weight: 500; line-height: 1.2; }
.lbl { font-size: .8rem; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: inherit; font-size: .9rem; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.chip .mono { color: var(--muted); font-size: .8rem; margin-left: 4px; }
.selinfo { margin-top: 16px; color: var(--muted); font-size: .9rem; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.actions.sticky { position: sticky; bottom: 0; background: var(--bg); padding: 12px 0 max(8px, env(safe-area-inset-bottom, 0px)); margin-top: 0; border-top: 1px solid var(--line); }
.btn { font: inherit; font-weight: 600; font-size: .95rem; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 18px; cursor: pointer; min-height: 44px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--muted); font-weight: 500; margin-left: auto; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:not(:disabled):hover { border-color: var(--accent); }
button:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.msg { margin-top: 12px; font-size: .9rem; color: var(--warn); }
.hist, .doms { list-style: none; margin: 0; padding: 0; }
.hist li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); font-size: .9rem; flex-wrap: wrap; }
.hist li:first-child { border-top: 0; }
.okc { color: var(--ok); } .badc { color: var(--bad); }
details > summary { cursor: pointer; font-weight: 600; }
textarea { width: 100%; font-family: var(--mono); font-size: .85rem; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 10px; resize: vertical; }
.code { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-size: .8rem; overflow-x: auto; margin: 12px 0 0; white-space: pre; }

.qhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: .9rem; }
.tag { font-size: .78rem; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 3px 10px; }
.timer { font-weight: 500; }
.timer.low { color: var(--bad); }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.bar.sm { height: 6px; grid-column: 1 / -1; }
.bar i.g { background: var(--ok); } .bar i.r { background: var(--bad); }
.prompt { font-size: 1.05rem; line-height: 1.55; max-width: 70ch; }
.notei { margin-top: 10px; font-size: .85rem; color: var(--warn); background: var(--warn-soft); border-radius: 6px; padding: 6px 10px; }
.hint { margin-top: 12px; font-size: .9rem; color: var(--muted); }
.opts { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
.opt { font: inherit; text-align: left; display: flex; gap: 12px; align-items: flex-start; width: 100%; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; cursor: pointer; min-width: 0; }
.opt .ltr { flex: none; width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 6px; font-size: .8rem; color: var(--muted); }
.opt .otx { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .ltr { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt.ok { border-color: var(--ok); background: var(--ok-soft); }
.opt.bad { border-color: var(--bad); background: var(--bad-soft); }
.opt.used { opacity: .45; }
.opt:disabled { cursor: default; }
.opt .mk, .fld .mk { font-size: .78rem; font-weight: 600; flex: none; }
.opt.ok .mk, .fld.ok .mk { color: var(--ok); } .opt.bad .mk, .fld.bad .mk { color: var(--bad); }
.flds { display: flex; flex-direction: column; gap: 14px; margin-top: 16px; }
.fld { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; }
.fld.ok { border-color: var(--ok); background: var(--ok-soft); } .fld.bad { border-color: var(--bad); background: var(--bad-soft); }
.fld label { font-weight: 600; overflow-wrap: anywhere; }
select { font: inherit; width: 100%; min-height: 44px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.seq { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.seq .empty { color: var(--muted); font-size: .9rem; padding: 8px 0; }
.fb { border-radius: 10px; padding: 16px 20px; border: 1px solid; display: flex; flex-direction: column; gap: 10px; }
.fb.okb { background: var(--ok-soft); border-color: var(--ok); }
.fb.badb { background: var(--bad-soft); border-color: var(--bad); }
.verdict { font-weight: 700; }
.okb .verdict { color: var(--ok); } .badb .verdict { color: var(--bad); }
.exp { overflow-wrap: anywhere; font-size: .95rem; }
.why { max-width: 70ch; }
.rev { font-size: .9rem; color: var(--warn); background: var(--warn-soft); border-radius: 6px; padding: 8px 12px; }
.pct { font-size: .6em; margin-left: 8px; }
.doms li { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 8px 0; font-size: .95rem; }
.rv { border-top: 1px solid var(--line); padding: 10px 0; }
.rv:first-of-type { border-top: 0; }
.rv summary { display: flex; gap: 10px; font-weight: 500; align-items: flex-start; }
.rv summary > span:last-child { min-width: 0; overflow-wrap: anywhere; }
.rv .st { flex: none; font-weight: 700; width: 48px; }
.rv > p { margin-top: 10px; padding-left: 58px; }
@media (max-width: 480px) { .rv > p { padding-left: 0; } .btn.quiet { margin-left: 0; } }
@media (prefers-reduced-motion: no-preference) { .bar i { transition: width .25s ease; } }
</style>
<div class="wrap"><main id="app"></main></div>
<script>
var DOMAINS = ["Identité & accès", "Réseau & Zero Trust", "Opérations de sécurité", "Données & stockage", "DevSecOps & conteneurs", "Gouvernance & multicloud"];
var D_ID = DOMAINS[0], D_NET = DOMAINS[1], D_OPS = DOMAINS[2], D_DATA = DOMAINS[3], D_DEV = DOMAINS[4], D_GOV = DOMAINS[5];
var YN = ["Yes", "No"];

var BANK = [
  {
    id: "q01", domain: D_OPS, type: "fields",
    q: "You are designing an auditing solution for Azure landing zones containing SQL audit logs (Azure SQL databases), Windows Security logs (Azure VMs) and App Service audit logs. The centralized logging solution must log all privileged access, retain logs for at least 365 days and minimize costs. What should you recommend for each log type?",
    fields: [
      { label: "For the SQL audit logs", options: ["A Log Analytics workspace", "Azure Application Insights", "Microsoft Defender for SQL", "Microsoft Sentinel"], answer: 0 },
      { label: "For the Security logs", options: ["A Log Analytics workspace", "Application Insights", "Microsoft Defender for servers", "Microsoft Sentinel"], answer: 0 },
      { label: "For the App Service audit logs", options: ["A Log Analytics workspace", "Application Insights", "Microsoft Defender for App Service", "Microsoft Sentinel"], answer: 0 }
    ],
    why: "Un espace de travail Log Analytics centralise les trois sources (paramètres de diagnostic, agent Azure Monitor) et sa rétention se règle au-delà de 365 jours. Sentinel et les plans Defender ajoutent des coûts de détection que l'énoncé ne demande pas."
  },
  {
    id: "q02", domain: D_OPS, type: "multi",
    q: "A customer plans to deploy Microsoft Sentinel. Servers in the perimeter network cannot connect directly to the internet. The security operations team must access the security logs and the operations logs. The IT operations team must access only the operations logs, including the event logs of the perimeter servers. Which two configurations can you include? Each correct answer presents a complete solution.",
    options: ["Configure Azure AD Conditional Access policies.", "Use the Azure Monitor agent with the multi-homing configuration.", "Implement resource-based role-based access control (RBAC) in Microsoft Sentinel.", "Create a custom collector that uses the Log Analytics agent."],
    answer: [1, 2],
    why: "Le multi-homing envoie les journaux d'exploitation vers un espace de travail distinct accessible à l'équipe IT, et le RBAC basé sur les ressources limite ce que chaque équipe voit. L'accès conditionnel contrôle l'authentification, pas l'accès aux tables de logs."
  },
  {
    id: "q03", domain: D_OPS, type: "fields",
    q: "Microsoft 365 Defender and Microsoft Defender for Cloud are enabled. A Microsoft Sentinel workspace has data connectors for Microsoft 365, Microsoft 365 Defender, Defender for Cloud and Azure. You plan to deploy Azure VMs running Windows Server. How should you enable EDR and SOAR capabilities for Microsoft Sentinel?",
    fields: [
      { label: "EDR", options: ["Add a Microsoft Sentinel data connector for Azure Active Directory (Azure AD).", "Add a Microsoft Sentinel data connector for Microsoft Defender for Cloud Apps.", "Onboard the servers to Azure Arc.", "Onboard the servers to Defender for Cloud."], answer: 3 },
      { label: "SOAR", options: ["Configure Microsoft Sentinel analytics rules.", "Configure Microsoft Sentinel playbooks.", "Configure regulatory compliance standards in Defender for Cloud.", "Configure workflow automation in Defender for Cloud."], answer: 1 }
    ],
    why: "Defender for Cloud déploie Defender for Endpoint sur les VM (EDR), et ses données remontent déjà dans Sentinel. Arc ne sert que pour des serveurs hors Azure. Le SOAR de Sentinel repose sur les playbooks (Logic Apps)."
  },
  {
    id: "q04", domain: D_GOV, type: "single",
    q: "You have an Azure subscription with Microsoft Defender for Cloud enabled. You need to enforce ISO 27001:2013 standards for new resources deployed to the subscription. The solution must ensure that noncompliant resources are automatically detected. What should you use?",
    options: ["Azure Blueprints", "The regulatory compliance dashboard in Defender for Cloud", "Azure role-based access control (Azure RBAC)", "Azure Policy"],
    answer: 3,
    why: "Azure Policy applique l'initiative ISO 27001 et évalue en continu les ressources, nouvelles comme existantes. Le tableau de bord de conformité n'est que la vue qui affiche les résultats de Policy."
  },
  {
    id: "q05", domain: D_OPS, type: "fields",
    q: "MSW1 is a Microsoft Sentinel workspace with 50 scheduled analytics rules. You design a SOAR solution with Sentinel playbooks. Expiration dates must be configurable when a playbook runs, and the administrative effort to configure individual analytics rules must be minimized. What should you use to invoke the playbooks, and which trigger type?",
    fields: [
      { label: "Use", options: ["Analytics rules", "Automation rules", "Investigation graphs"], answer: 1 },
      { label: "Trigger type", options: ["Alert", "Entity", "Incident"], answer: 2 }
    ],
    why: "Une règle d'automatisation s'applique à plusieurs règles d'analyse à la fois et accepte une date d'expiration. Elle se déclenche sur les incidents."
  },
  {
    id: "q06", domain: D_OPS, type: "fields",
    q: "An Azure application gateway uses Azure WAF. You deploy new App Services web apps, each registered automatically in the company DNS domain and accessible from the Internet. Which solution detects vulnerability scans of the apps, and which detects whether newly deployed apps are vulnerable to attack?",
    fields: [
      { label: "To detect vulnerability scans of the apps", options: ["Azure WAF", "Microsoft Defender External Attack Surface Management (Defender EASM)", "Microsoft Defender for App Service", "Microsoft Defender for Cloud Apps"], answer: 2 },
      { label: "To detect whether newly deployed apps are vulnerable to attack", options: ["Azure WAF", "Microsoft Defender External Attack Surface Management (Defender EASM)", "Microsoft Defender for App Service", "Microsoft Defender for Cloud Apps"], answer: 1 }
    ],
    why: "Defender for App Service analyse les requêtes web des applications protégées et peut signaler du balayage. Defender EASM découvre en continu les ressources exposées sur Internet, y compris celles qui apparaissent dans le DNS après un déploiement.",
    rev: "J'avais d'abord répondu Defender EASM pour les deux champs. Ma recherche n'a pas retrouvé l'alerte exacte de détection de balayage dans la documentation. Vérifiez la première réponse avant de la retenir."
  },
  {
    id: "q07", domain: D_OPS, type: "fields",
    q: "You need a Microsoft 365 Defender solution that identifies users downloading an unusually high number of files from SharePoint Online (possible data exfiltration) and blocks Microsoft Teams messages containing potentially malicious content by using zero-hour auto purge (ZAP).",
    fields: [
      { label: "Identify data exfiltration attempts", options: ["Microsoft Defender for Cloud Apps", "Microsoft Defender for Endpoint", "Microsoft Defender for Identity", "Microsoft Defender for Office 365"], answer: 0 },
      { label: "Block Teams messages", options: ["Microsoft Defender for Cloud Apps", "Microsoft Defender for Endpoint", "Microsoft Defender for Identity", "Microsoft Defender for Office 365"], answer: 3 }
    ],
    why: "Defender for Cloud Apps contient la politique de détection d'anomalies sur les téléchargements inhabituels. ZAP, y compris pour Teams, relève de Defender for Office 365."
  },
  {
    id: "q08", domain: D_GOV, type: "fields",
    q: "Three Microsoft Entra tenants (Tenant1 to Tenant3) each have a subscription (Sub1 to Sub3) containing one Sentinel workspace (Sentinel1 to Sentinel3, one per tenant). Users in Tenant1 must manage resources in Sub2 and Sub3 without switching subscriptions or signing in to another tenant. You must implement the multiple workspace view for Sentinel2 and Sentinel3. What delegates permissions, and what will users manage in the multiple workspace view?",
    note: "Les options des deux listes sont reconstituées : comparez-les à l'énoncé d'origine.",
    fields: [
      { label: "Delegate permissions with", options: ["Azure Lighthouse", "Azure Policy", "Microsoft Entra Privileged Identity Management", "Azure Blueprints"], answer: 0 },
      { label: "Feature managed in multiple workspace view", options: ["Incidents", "Workbooks", "Analytics rules", "Playbooks"], answer: 0 }
    ],
    why: "Azure Lighthouse délègue la gestion entre tenants sans changer de contexte. La vue multi-espaces de travail de Sentinel sert à gérer les incidents de plusieurs espaces de travail dans une seule liste.",
    rev: "J'avais répondu « Workbooks » pour la seconde liste. La vue multi-espaces de travail est décrite par Microsoft pour les incidents. Confirmez avec les options réelles de l'énoncé."
  },
  {
    id: "q09", domain: D_DEV, type: "single",
    q: "You plan to deploy multiple containerized microservice-based apps to Azure Kubernetes Service (AKS). The solution must manage secrets, provide encryption, secure service-to-service communication by using mTLS encryption and minimize administrative effort. What should you include?",
    options: ["Flux", "Envoy", "Dapr", "Istio"],
    answer: 2,
    why: "Dapr couvre les quatre exigences : bloc de gestion des secrets, mTLS automatique entre services et extension AKS gérée. Istio fournit le mTLS mais pas la gestion des secrets applicatifs.",
    rev: "J'avais répondu Istio. L'exigence « gère les secrets » penche vers Dapr, mais je n'ai pas pu confirmer la réponse officielle. À vérifier."
  },
  {
    id: "q10", domain: D_ID, type: "single",
    q: "You have a multicloud environment that contains Azure, Amazon Web Services (AWS) and Google Cloud Platform (GCP) subscriptions. You need to discover and review role assignments across the subscriptions. What should you use?",
    options: ["Microsoft Entra Permissions Management", "Microsoft Defender for Identity", "Azure Lighthouse", "Microsoft Entra ID Governance"],
    answer: 0,
    why: "Entra Permissions Management est la solution CIEM qui couvre Azure, AWS et GCP. Lighthouse reste limité à Azure et Entra ID Governance à l'identité Entra."
  },
  {
    id: "q11", domain: D_DATA, type: "fields",
    q: "You plan to implement Azure Synapse Analytics SQL dedicated pools and SQL serverless pools. You need additional encryption-at-rest security for each type of pool, using customer-managed keys whenever possible.",
    fields: [
      { label: "Serverless SQL pool", options: ["Azure Storage infrastructure encryption and Microsoft-managed keys", "Transparent Data Encryption (TDE) and customer-managed keys", "Transparent Data Encryption (TDE) and Microsoft-managed keys"], answer: 0 },
      { label: "Dedicated SQL pool", options: ["Azure Storage infrastructure encryption and Microsoft-managed keys", "Transparent Data Encryption (TDE) and customer-managed keys", "Transparent Data Encryption (TDE) and Microsoft-managed keys"], answer: 1 }
    ],
    why: "Le pool dédié accepte TDE avec une clé gérée par le client. Le pool serverless n'offre pas cette option : on y ajoute le chiffrement d'infrastructure du stockage, avec des clés gérées par Microsoft."
  },
  {
    id: "q12", domain: D_NET, type: "single",
    q: "You have an on-premises app named App1 that remote users access by using VPN connections, and a third-party SaaS app named App2. You need to deploy Global Secure Access to manage access to App1 and App2. What should you use for each app?",
    options: ["Microsoft Entra Private Access for App1 and Microsoft Entra Internet Access for App2", "Microsoft Entra Private Access for App1 and App2", "Microsoft Entra Internet Access for App1 and App2", "Microsoft Entra Private Access for App2 and Microsoft Entra Internet Access for App1"],
    answer: 0,
    why: "Private Access remplace le VPN pour les applications privées. Internet Access sécurise le trafic vers Internet et les applications SaaS."
  },
  {
    id: "q13", domain: D_NET, type: "single",
    q: "Several NSGs contain rules that allow direct RDP access to virtual machines, bypassing the Azure Bastion host bastion1. You need to ensure the VMs can be accessed only by using bastion1, and prevent NSG rules from bypassing it. What should you include?",
    options: ["Azure Virtual Network Manager connectivity configurations", "Azure Virtual Network Manager security admin rules", "Azure Firewall application rules", "Azure Firewall network rules"],
    answer: 1,
    why: "Les règles d'administrateur de sécurité d'Azure Virtual Network Manager ont priorité sur les règles NSG locales, qui ne peuvent donc pas les contourner."
  },
  {
    id: "q14", domain: D_NET, type: "fields",
    q: "You have a Microsoft 365 E5 subscription and plan to deploy Global Secure Access universal tenant restrictions v2. Which authentication plane resources and which data plane resources will be protected?",
    fields: [
      { label: "Authentication plane resources", options: ["All Microsoft Entra ID integrated apps, including third-party apps", "All Microsoft 365 apps", "Microsoft SharePoint Online and Exchange Online only"], answer: 0 },
      { label: "Data plane resources", options: ["All Microsoft Entra ID integrated apps, including third-party apps", "All Microsoft 365 apps", "Microsoft SharePoint Online and Exchange Online only"], answer: 1 }
    ],
    why: "La restriction au niveau de l'authentification s'applique à toutes les applications protégées par Entra ID. La protection du plan de données est plus étroite.",
    rev: "La page de documentation que j'ai consultée confirme la portée du plan d'authentification, mais pas celle du plan de données. Votre capture proposait « SharePoint Online and Exchange Online only » : à trancher avec la source de l'énoncé."
  },
  {
    id: "q15", domain: D_DATA, type: "order",
    q: "RG1 contains multiple Azure Files shares. You must deploy a backup solution that prevents the deletion of backups and of the vault, prevents privilege escalation attacks against the backup solution and prevents modification of the backup retention period. Which three actions should you recommend, in sequence?",
    options: ["Create an Azure Backup vault.", "From RG1, create a resource lock.", "Create a Recovery Services vault.", "Enable vault immutability.", "Lock immutability for the vault."],
    answer: [2, 3, 4],
    why: "La sauvegarde des partages Azure Files passe par un Recovery Services vault. On active ensuite l'immuabilité, puis on la verrouille pour qu'aucun compte, même privilégié, ne puisse la désactiver.",
    rev: "Correction : j'avais écrit qu'il fallait un Azure Backup vault. Pour Azure Files, c'est le Recovery Services vault. Le schéma comparatif des deux coffres que je vous avais montré contenait la même erreur."
  },
  {
    id: "q16", domain: D_NET, type: "fields",
    q: "VNet1 contains Subnet1 and Subnet2. VM1 runs App1 and is connected to Subnet1. DB1 is an Azure SQL Database that contains data for App1 and is accessible from the internet. Only the virtual machines connected to Subnet1 must be able to connect to DB1, DB1 must be inaccessible from the internet and costs must be minimized.",
    fields: [
      { label: "To ensure that only VM1 can access DB1", options: ["A private endpoint", "Azure Application Gateway", "Azure Private Link"], answer: 0 },
      { label: "To enforce network security restrictions for DB1", options: ["Azure Firewall rules", "Network security groups (NSGs)", "Virtual network rules"], answer: 1 }
    ],
    why: "Un point de terminaison privé donne à DB1 une adresse IP privée dans le VNet et permet de couper l'accès public. Les NSG sont gratuits, contrairement à Azure Firewall."
  },
